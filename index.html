<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX CORE - 11x11 Tactical Neon Grid</title>
    <!-- Sci-Fi Google Fonts & Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&family=Noto+Sans+TC:wght@600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050811;
            --cyan: #00f3ff;
            --cyan-glow: rgba(0, 243, 255, 0.6);
            --crimson: #ff0055;
            --crimson-glow: rgba(255, 0, 85, 0.6);
            --panel-bg: rgba(13, 19, 35, 0.85);
            --border-line: rgba(0, 243, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Chakra Petch', 'Rajdhani', 'Noto Sans TC', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 243, 255, 0.05) 0%, transparent 65%),
                radial-gradient(circle at 50% 80%, rgba(255, 0, 85, 0.05) 0%, transparent 65%),
                linear-gradient(to bottom, #040710 0%, #070c1b 100%);
        }

        /* Sci-Fi Text Glow Classes */
        .tech-glow-cyan {
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.8), 0 0 18px rgba(0, 243, 255, 0.4);
        }

        .tech-glow-crimson {
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.8), 0 0 18px rgba(255, 0, 85, 0.4);
        }

        .tech-glow-white {
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.7), 0 0 15px rgba(0, 243, 255, 0.3);
        }

        /* Glassmorphism containers */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            border-radius: 16px;
        }

        /* Cyberpunk Button Styling */
        .cyber-btn {
            position: relative;
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.15) 0%, rgba(0, 150, 255, 0.35) 100%);
            border: 1px solid var(--cyan);
            color: #ffffff;
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 12px 28px;
            border-radius: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.25);
            cursor: pointer;
        }

        .cyber-btn:hover {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.35) 0%, rgba(0, 150, 255, 0.6) 100%);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
            transform: translateY(-2px);
        }

        .cyber-btn-crimson {
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.15) 0%, rgba(200, 0, 60, 0.35) 100%);
            border-color: var(--crimson);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.25);
        }

        .cyber-btn-crimson:hover {
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.35) 0%, rgba(200, 0, 60, 0.6) 100%);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.5);
        }

        .cyber-btn-neutral {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
            color: #e2e8f0;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
        }

        .cyber-btn-neutral:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
            color: #ffffff;
        }

        /* Screen Transitions */
        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .screen.active {
            display: flex;
            opacity: 1;
        }

        /* Canvas Wrapper */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 860px;
            aspect-ratio: 1.35 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        /* Coin Flip Animation Card */
        .coin-flip-card {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 900;
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            transition: transform 0.08s linear;
            box-shadow: 0 0 30px currentColor;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center">

    <!-- 1. HOME SCREEN -->
    <div id="home-screen" class="screen active flex-col items-center justify-center text-center p-6 w-full h-full">
        <div class="glass-panel p-10 max-w-lg w-full flex flex-col items-center border-t-2 border-cyan-400">
            <h1 class="text-5xl md:text-6xl font-black tracking-[0.2em] mb-2 text-white font-['Orbitron'] tech-glow-cyan">
                HEX CORE
            </h1>
            <p class="text-sm md:text-base text-cyan-300/80 tracking-[0.3em] mb-8 font-['Share_Tech_Mono'] font-bold">11x11 NEON TACTICAL GRID</p>

            <div class="bg-black/40 border border-slate-700/60 rounded-xl p-4 w-full mb-8 text-center">
                <span class="text-xs text-gray-400 uppercase tracking-[0.25em] block mb-1 font-['Share_Tech_Mono']">遊戲模式 MODE</span>
                <span class="text-lg font-bold text-cyan-400 tracking-widest font-['Orbitron'] tech-glow-cyan">PvP 玩家對戰</span>
            </div>

            <button onclick="onStartGameClick()" class="cyber-btn w-full text-lg py-4 font-['Chakra_Petch'] tracking-widest tech-glow-white">
                開始遊戲 START GAME
            </button>
        </div>
    </div>

    <!-- 2. COIN TOSS SCREEN -->
    <div id="cointoss-screen" class="screen flex-col items-center justify-center text-center p-6 w-full h-full">
        <div class="glass-panel p-10 max-w-md w-full flex flex-col items-center">
            <h2 class="text-xl font-bold tracking-[0.2em] text-gray-200 mb-2 font-['Orbitron'] tech-glow-white">COIN FLIP PROTOCOL</h2>
            <p class="text-xs text-cyan-400/80 mb-8 tracking-[0.25em] font-['Share_Tech_Mono']">DECIDING FIRST MOVE PLAYER</p>
            
            <div id="coin-element" class="coin-flip-card mb-8 bg-black/70 border-4 border-cyan-400 text-cyan-400">
                <span id="coin-text" class="font-['Orbitron']">READY</span>
            </div>

            <div id="coin-result-text" class="text-lg font-bold h-8 tracking-wider text-white font-['Chakra_Petch']"></div>
        </div>
    </div>

    <!-- 3. GAME PLAY SCREEN (Clean status header layout) -->
    <div id="game-screen" class="screen flex-col items-center justify-start pt-4 px-4 w-full h-full max-w-5xl">
        <!-- Top Status Bar (Status Text & Return Button) -->
        <div class="w-full max-w-[840px] px-4 py-3 flex items-center justify-between gap-2 sm:gap-4 mb-2 border border-slate-700/60 rounded-2xl bg-[#0c1222]/90 backdrop-blur-md shadow-lg">
            <!-- Left: Turn Status Indicator -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <span id="ui-turn-dot" class="w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full bg-pink-500 inline-block shadow-[0_0_12px_#ff0055] flex-shrink-0"></span>
                <span id="ui-turn-text" class="text-xs sm:text-base font-bold tracking-wider text-gray-100 font-['Chakra_Petch','Orbitron']">
                    輪到 B方 (紅色) 下子 (剩餘 1 顆)
                </span>
            </div>

            <!-- Right: Return Home Button -->
            <button onclick="goHome()" class="px-3 py-1.5 sm:px-5 sm:py-1.5 rounded-lg border border-slate-600/80 bg-slate-800/80 hover:bg-slate-700 text-xs sm:text-sm font-bold text-gray-200 tracking-wider font-['Chakra_Petch'] transition-colors shadow-sm cursor-pointer flex-shrink-0 hover:text-cyan-400">
                返回首頁
            </button>
        </div>

        <!-- Center Interactive Parallelogram Canvas -->
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="1100" height="820"></canvas>
        </div>
    </div>

    <!-- 4. GAME OVER MODAL -->
    <div id="win-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center z-50 p-4">
        <div class="glass-panel p-8 max-w-md w-full flex flex-col items-center text-center border-t-4 border-cyan-400 animate-fade-in">
            <div class="text-xs text-cyan-400 tracking-widest font-bold mb-2 font-['Orbitron']">MATCH COMPLETED</div>
            <h2 id="modal-winner-title" class="text-3xl md:text-4xl font-black mb-2 text-white font-['Noto_Sans_TC','Orbitron']">
                A方 (藍色) 獲勝！
            </h2>
            <p id="modal-winner-desc" class="text-sm text-gray-300 mb-6 font-medium">成功連通目標邊界</p>

            <!-- Action Buttons requested by user -->
            <div class="flex flex-col space-y-3 w-full">
                <button onclick="downloadRecord()" class="cyber-btn cyber-btn-neutral w-full py-3 text-sm flex items-center justify-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    下載過程圖 (含顏色與數字)
                </button>
                <button onclick="playAgain()" class="cyber-btn w-full py-3 text-sm">
                    再一次 (同樣的順序)
                </button>
                <button onclick="goHome()" class="cyber-btn cyber-btn-crimson w-full py-3 text-sm">
                    回首頁
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Color Palette Matching Screenshot IMG_0880_ee2465.jpeg
        const COLORS = {
            bg: '#050811',            // Deep navy-black canvas background
            cyan: '#00f3ff',          // Glowing Cyan (Player A / Left-Right Border)
            cyanFill: '#00c8e6',
            crimson: '#ff0055',       // Glowing Crimson (Player B / Top-Bottom Border)
            crimsonFill: '#e6004c',
            gridLine: 'rgba(0, 180, 220, 0.35)', // Empty hex outline
            cellBg: '#070b16',        // Dark hex inner fill
            hoverGlow: 'rgba(255, 255, 255, 0.3)'
        };

        const GRID_SIZE = 11; // 11x11 Hex Grid
        const TURN_PATTERN = [1, 2, 2, 1]; // 12211221...

        // Game State Variables
        let firstPlayer = 'A'; // 'A' (藍) or 'B' (紅)
        let moveHistory = [];  // [{r, c, color, step}]
        let boardState = {};   // key: "r,c" -> { color, step }
        let winningPath = null;
        let hoveredCell = null;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Geometry parameters
        let hexRadius = 24;
        let hexWidth = Math.sqrt(3) * hexRadius;
        let hexHeight = 2 * hexRadius;
        let boardOffsetX = 0;
        let boardOffsetY = 0;

        // Init on Window Load
        window.addEventListener('load', () => {
            showScreen('home-screen');
            setupCanvasEvents();
            resizeCanvas();
        });

        window.addEventListener('resize', resizeCanvas);

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // 1. HOME & COIN TOSS
        function onStartGameClick() {
            runCoinToss();
        }

        function runCoinToss() {
            showScreen('cointoss-screen');
            const coinEl = document.getElementById('coin-element');
            const coinText = document.getElementById('coin-text');
            const resultText = document.getElementById('coin-result-text');

            resultText.innerText = '';
            let ticks = 0;
            const maxTicks = 20;

            const interval = setInterval(() => {
                ticks++;
                const isATurn = (ticks % 2 === 0);
                
                coinEl.style.transform = `scale(${1 + (ticks % 3) * 0.06}) rotateY(${ticks * 45}deg)`;
                
                if (isATurn) {
                    coinEl.style.borderColor = COLORS.cyan;
                    coinEl.style.color = COLORS.cyan;
                    coinEl.style.boxShadow = `0 0 30px ${COLORS.cyan}`;
                    coinText.innerText = 'A 方 (藍)';
                } else {
                    coinEl.style.borderColor = COLORS.crimson;
                    coinEl.style.color = COLORS.crimson;
                    coinEl.style.boxShadow = `0 0 30px ${COLORS.crimson}`;
                    coinText.innerText = 'B 方 (紅)';
                }

                if (ticks >= maxTicks) {
                    clearInterval(interval);
                    coinEl.style.transform = 'scale(1) rotateY(0deg)';
                    
                    // Random pick first player
                    firstPlayer = Math.random() < 0.5 ? 'A' : 'B';
                    
                    if (firstPlayer === 'A') {
                        coinEl.style.borderColor = COLORS.cyan;
                        coinEl.style.color = COLORS.cyan;
                        coinText.innerText = 'A 方 (藍)';
                        resultText.innerText = '⚡ A方 獲得先攻權 (先手 1)';
                        resultText.className = 'text-lg font-bold h-8 tracking-wider text-cyan-400 font-["Chakra_Petch"] tech-glow-cyan';
                    } else {
                        coinEl.style.borderColor = COLORS.crimson;
                        coinEl.style.color = COLORS.crimson;
                        coinText.innerText = 'B 方 (紅)';
                        resultText.innerText = '⚡ B方 獲得先攻權 (先手 1)';
                        resultText.className = 'text-lg font-bold h-8 tracking-wider text-pink-500 font-["Chakra_Petch"] tech-glow-crimson';
                    }

                    setTimeout(() => {
                        startNewMatch();
                    }, 1300);
                }
            }, 90);
        }

        // 2. MATCH START & 12211221 SEQUENCE
        function startNewMatch() {
            moveHistory = [];
            boardState = {};
            winningPath = null;
            document.getElementById('win-modal').classList.add('hidden');
            showScreen('game-screen');
            updateUI();
            resizeCanvas();
        }

        function getCurrentStep() {
            return moveHistory.length + 1;
        }

        function getCurrentPlayer() {
            const step = getCurrentStep();
            // Sequence pattern: 1, 2, 2, 1 -> index (step - 1) % 4
            const patternVal = TURN_PATTERN[(step - 1) % 4];
            const secondPlayer = (firstPlayer === 'A') ? 'B' : 'A';
            return (patternVal === 1) ? firstPlayer : secondPlayer;
        }

        function getRemainingInTurn() {
            const m = moveHistory.length;
            if (m === 0) return 1;
            return (m % 2 === 1) ? 2 : 1;
        }

        function updateUI() {
            const player = getCurrentPlayer();
            const remaining = getRemainingInTurn();

            const dotEl = document.getElementById('ui-turn-dot');
            const textEl = document.getElementById('ui-turn-text');

            if (player === 'A') {
                dotEl.className = 'w-4 h-4 rounded-full bg-cyan-400 inline-block shadow-[0_0_12px_#00f3ff]';
                textEl.innerHTML = `輪到 <span class="font-bold text-cyan-400 tech-glow-cyan">A方 (藍色)</span> 下子 (剩餘 <span class="font-bold text-cyan-400 font-['Orbitron'] tech-glow-cyan">${remaining}</span> 顆)`;
            } else {
                dotEl.className = 'w-4 h-4 rounded-full bg-pink-500 inline-block shadow-[0_0_12px_#ff0055]';
                textEl.innerHTML = `輪到 <span class="font-bold text-pink-500 tech-glow-crimson">B方 (紅色)</span> 下子 (剩餘 <span class="font-bold text-pink-500 font-['Orbitron'] tech-glow-crimson">${remaining}</span> 顆)`;
            }
        }

        // 3. CANVAS & PARALLELOGRAM HEX GEOMETRY (Matching IMG_0880_ee2465.jpeg)
        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            if (!wrapper) return;
            const w = wrapper.clientWidth || 840;
            const h = wrapper.clientHeight || 620;
            
            const dpr = window.devicePixelRatio || 1;
            canvas.width = w * dpr;
            canvas.height = h * dpr;

            // Recalculate Hex Size based on Canvas dimensions
            const totalWidthUnits = (GRID_SIZE + GRID_SIZE * 0.5 + 2.2) * Math.sqrt(3);
            const totalHeightUnits = (GRID_SIZE * 1.5 + 3.2);

            const scaleX = canvas.width / totalWidthUnits;
            const scaleY = canvas.height / totalHeightUnits;

            hexRadius = Math.min(scaleX, scaleY);
            hexWidth = Math.sqrt(3) * hexRadius;
            hexHeight = 2 * hexRadius;

            // Center Parallelogram Grid
            boardOffsetX = (canvas.width - (GRID_SIZE * hexWidth + (GRID_SIZE - 1) * (hexWidth / 2))) / 2;
            boardOffsetY = (canvas.height - (GRID_SIZE * 1.5 * hexRadius)) / 2 + hexRadius * 0.6;

            drawBoard();
        }

        function getHexCenter(r, c) {
            // Pointy-topped hexagon center position in parallelogram grid
            const x = boardOffsetX + c * hexWidth + r * (hexWidth / 2);
            const y = boardOffsetY + r * (1.5 * hexRadius);
            return { x, y };
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Fill Background
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Empty/Placed Hex Grid
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    drawHexCell(r, c);
                }
            }

            // 2. Draw Top & Bottom Crimson (A-K) and Left & Right Cyan (1-11) Coordinate Badges
            drawCoordinateBadges();

            // 3. Draw Winning Path Line Overlay if game over
            if (winningPath && winningPath.length > 0) {
                drawWinningPath();
            }
        }

        // Draw Coordinate Circular Badges strictly matching IMG_0880_ee2465.jpeg
        function drawCoordinateBadges() {
            ctx.save();
            const badgeRadius = hexRadius * 0.46;
            ctx.font = `700 ${Math.max(13, hexRadius * 0.54)}px "Share Tech Mono", monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const colLabels = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K'];

            // 1. Top & Bottom RED/CRIMSON Circular Badges (A - K: 黑底紅字)
            for (let c = 0; c < GRID_SIZE; c++) {
                // Top Badge (above Row 0)
                const topPos = getHexCenter(0, c);
                const topY = topPos.y - hexRadius * 1.5;
                drawBadgeCircle(topPos.x, topY, badgeRadius, colLabels[c], COLORS.crimson);

                // Bottom Badge (below Row 10)
                const botPos = getHexCenter(GRID_SIZE - 1, c);
                const botY = botPos.y + hexRadius * 1.5;
                drawBadgeCircle(botPos.x, botY, badgeRadius, colLabels[c], COLORS.crimson);
            }

            // 2. Left & Right CYAN Circular Badges (1 - 11: 黑底藍字)
            for (let r = 0; r < GRID_SIZE; r++) {
                // Left Badge (left of Col 0)
                const leftPos = getHexCenter(r, 0);
                const leftX = leftPos.x - hexWidth * 0.85;
                drawBadgeCircle(leftX, leftPos.y, badgeRadius, (r + 1).toString(), COLORS.cyan);

                // Right Badge (right of Col 10)
                const rightPos = getHexCenter(r, GRID_SIZE - 1);
                const rightX = rightPos.x + hexWidth * 0.85;
                drawBadgeCircle(rightX, rightPos.y, badgeRadius, (r + 1).toString(), COLORS.cyan);
            }

            ctx.restore();
        }

        function drawBadgeCircle(x, y, radius, text, color) {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            // Black/Dark background fill
            ctx.fillStyle = COLORS.cellBg;
            ctx.fill();

            // Colored border outline with slight glow effect
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 6;
            ctx.stroke();

            // Colored centered text using monospace tech font
            ctx.shadowBlur = 4;
            ctx.fillStyle = color;
            ctx.fillText(text, x, y + 1);
            ctx.shadowBlur = 0;
        }

        // Draw Individual Hexagon Cell (Matching screenshot colors)
        function drawHexCell(r, c) {
            const { x, y } = getHexCenter(r, c);
            const key = `${r},${c}`;
            const cellData = boardState[key];
            const isHovered = hoveredCell && hoveredCell.r === r && hoveredCell.c === c && !cellData;

            ctx.save();
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 180) * (60 * i - 30);
                const px = x + hexRadius * Math.cos(angle);
                const py = y + hexRadius * Math.sin(angle);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();

            if (cellData) {
                // Placed Piece Styling
                const isPlayerA = (cellData.color === 'A');
                const fillColor = isPlayerA ? COLORS.cyan : COLORS.crimson;
                const glowColor = isPlayerA ? COLORS.cyan : COLORS.crimson;

                ctx.fillStyle = fillColor;
                ctx.fill();

                ctx.lineWidth = 2.5;
                ctx.strokeStyle = '#ffffff';
                ctx.shadowColor = glowColor;
                ctx.shadowBlur = 14;
                ctx.stroke();

                // Bold White Move Number inside Hexagon with Orbitron Tech Font
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 6;
                ctx.fillStyle = '#ffffff';
                ctx.font = `900 ${hexRadius * 0.72}px Orbitron, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(cellData.step, x, y + 1);

            } else if (isHovered) {
                // Active Hover Indicator
                const curPlayer = getCurrentPlayer();
                ctx.fillStyle = (curPlayer === 'A') ? 'rgba(0, 243, 255, 0.25)' : 'rgba(255, 0, 85, 0.25)';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = (curPlayer === 'A') ? COLORS.cyan : COLORS.crimson;
                ctx.stroke();
            } else {
                // Empty Grid Cell (Deep dark navy fill with cyan outline)
                ctx.fillStyle = COLORS.cellBg;
                ctx.fill();
                ctx.lineWidth = 1.2;
                ctx.strokeStyle = COLORS.gridLine;
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawWinningPath() {
            if (!winningPath || winningPath.length < 2) return;

            ctx.save();
            ctx.beginPath();
            winningPath.forEach((pt, index) => {
                const { x, y } = getHexCenter(pt.r, pt.c);
                if (index === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });

            ctx.lineWidth = 5;
            ctx.strokeStyle = '#ffffff';
            ctx.shadowColor = '#ffff00';
            ctx.shadowBlur = 18;
            ctx.stroke();

            // Draw connecting nodes
            winningPath.forEach(pt => {
                const { x, y } = getHexCenter(pt.r, pt.c);
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            });

            ctx.restore();
        }

        // 4. MOUSE / TOUCH INTERACTION
        function setupCanvasEvents() {
            function getEventPos(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }

            function handleMove(e) {
                const pos = getEventPos(e);
                const found = findNearestHex(pos.x, pos.y);
                if (found !== hoveredCell) {
                    hoveredCell = found;
                    drawBoard();
                }
            }

            function handleClick(e) {
                const pos = getEventPos(e);
                const hex = findNearestHex(pos.x, pos.y);
                if (hex) {
                    makeMove(hex.r, hex.c);
                }
            }

            canvas.addEventListener('mousemove', handleMove);
            canvas.addEventListener('click', handleClick);

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleClick(e);
            }, { passive: false });
        }

        function findNearestHex(mx, my) {
            let minDistance = Infinity;
            let nearest = null;

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const { x, y } = getHexCenter(r, c);
                    const dist = Math.hypot(mx - x, my - y);
                    if (dist < hexRadius * 0.95 && dist < minDistance) {
                        minDistance = dist;
                        nearest = { r, c };
                    }
                }
            }
            return nearest;
        }

        // 5. GAMEPLAY LOGIC & BFS WIN PATHFINDING
        function makeMove(r, c) {
            if (winningPath) return; // Game ended
            const key = `${r},${c}`;
            if (boardState[key]) return; // Occupied

            const step = getCurrentStep();
            const player = getCurrentPlayer();

            // Record move
            boardState[key] = { color: player, step };
            moveHistory.push({ r, c, color: player, step });

            updateUI();
            drawBoard();

            // Check Win condition immediately
            const winPath = checkWin(player);
            if (winPath) {
                winningPath = winPath;
                drawBoard();

                setTimeout(() => {
                    triggerGameOver(player, winPath);
                }, 400);
            }
        }

        function getNeighbors(r, c) {
            const neighbors = [
                { r: r,     c: c - 1 }, // Left
                { r: r,     c: c + 1 }, // Right
                { r: r - 1, c: c     }, // Top-Left
                { r: r - 1, c: c + 1 }, // Top-Right
                { r: r + 1, c: c - 1 }, // Bottom-Left
                { r: r + 1, c: c     }  // Bottom-Right
            ];
            return neighbors.filter(n => n.r >= 0 && n.r < GRID_SIZE && n.c >= 0 && n.c < GRID_SIZE);
        }

        function checkWin(player) {
            const queue = [];
            const visited = new Set();
            const parentMap = {};

            // Player B (RED): Top Row (r=0) ➔ Bottom Row (r=10)
            // Player A (BLUE): Left Col (c=0) ➔ Right Col (c=10)
            if (player === 'B') {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const key = `0,${c}`;
                    if (boardState[key] && boardState[key].color === 'B') {
                        queue.push({ r: 0, c });
                        visited.add(key);
                    }
                }
            } else { // Player A
                for (let r = 0; r < GRID_SIZE; r++) {
                    const key = `${r},0`;
                    if (boardState[key] && boardState[key].color === 'A') {
                        queue.push({ r, c: 0 });
                        visited.add(key);
                    }
                }
            }

            while (queue.length > 0) {
                const curr = queue.shift();
                const currKey = `${curr.r},${curr.c}`;

                if ((player === 'B' && curr.r === GRID_SIZE - 1) ||
                    (player === 'A' && curr.c === GRID_SIZE - 1)) {
                    
                    const path = [curr];
                    let pKey = currKey;
                    while (parentMap[pKey]) {
                        const parent = parentMap[pKey];
                        path.unshift(parent);
                        pKey = `${parent.r},${parent.c}`;
                    }
                    return path;
                }

                const neighbors = getNeighbors(curr.r, curr.c);
                for (let n of neighbors) {
                    const nKey = `${n.r},${n.c}`;
                    if (!visited.has(nKey) && boardState[nKey] && boardState[nKey].color === player) {
                        visited.add(nKey);
                        parentMap[nKey] = curr;
                        queue.push(n);
                    }
                }
            }

            return null;
        }

        // 6. MODAL & ACTIONS
        function triggerGameOver(winner, path) {
            const modal = document.getElementById('win-modal');
            const titleEl = document.getElementById('modal-winner-title');
            const descEl = document.getElementById('modal-winner-desc');

            if (winner === 'A') {
                titleEl.innerText = 'A方 (藍色) 獲勝！';
                titleEl.className = 'text-3xl md:text-4xl font-black mb-2 text-cyan-400 font-["Chakra_Petch"] tech-glow-cyan';
                descEl.innerText = 'SYSTEM CONNECTED: LEFT ➔ RIGHT';
            } else {
                titleEl.innerText = 'B方 (紅色) 獲勝！';
                titleEl.className = 'text-3xl md:text-4xl font-black mb-2 text-pink-500 font-["Chakra_Petch"] tech-glow-crimson';
                descEl.innerText = 'SYSTEM CONNECTED: TOP ➔ BOTTOM';
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        // Action 1: Download PNG of Canvas (Including dark background, numbers, colors)
        function downloadRecord() {
            drawBoard();
            const imageURL = canvas.toDataURL('image/png');
            const downloadLink = document.createElement('a');
            downloadLink.download = `HEX_CORE_MATCH_${Date.now()}.png`;
            downloadLink.href = imageURL;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        // Action 2: Play Again (Same initial sequence)
        function playAgain() {
            startNewMatch();
        }

        // Action 3: Return Home
        function goHome() {
            document.getElementById('win-modal').classList.add('hidden');
            showScreen('home-screen');
        }
    </script>
