<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX CORE - 11x11 Tactical Neon Grid</title>
    <!-- Sci-Fi Google Fonts & Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&family=Noto+Sans+TC:wght@600;700;900&display=swap" rel="stylesheet">
    
    <!-- PeerJS SDK (用於跨網路 P2P 連線) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #050811;
            --cyan: #00f3ff;
            --cyan-glow: rgba(0, 243, 255, 0.6);
            --crimson: #ff0055;
            --crimson-glow: rgba(255, 0, 85, 0.6);
            --panel-bg: rgba(13, 19, 35, 0.85);
            --border-line: rgba(0, 243, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Chakra Petch', 'Rajdhani', 'Noto Sans TC', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            width: 100vw;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 243, 255, 0.05) 0%, transparent 65%),
                radial-gradient(circle at 50% 80%, rgba(255, 0, 85, 0.05) 0%, transparent 65%),
                linear-gradient(to bottom, #040710 0%, #070c1b 100%);
        }

        /* Sci-Fi Text Glow Classes */
        .tech-glow-cyan {
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.8), 0 0 18px rgba(0, 243, 255, 0.4);
        }

        .tech-glow-crimson {
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.8), 0 0 18px rgba(255, 0, 85, 0.4);
        }

        .tech-glow-white {
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.7), 0 0 15px rgba(0, 243, 255, 0.3);
        }

        /* Glassmorphism containers */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            border-radius: 16px;
        }

        /* Cyberpunk Button Styling */
        .cyber-btn {
            position: relative;
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.15) 0%, rgba(0, 150, 255, 0.35) 100%);
            border: 1px solid var(--cyan);
            color: #ffffff;
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 12px 28px;
            border-radius: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.25);
            cursor: pointer;
        }

        .cyber-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.35) 0%, rgba(0, 150, 255, 0.6) 100%);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
            transform: translateY(-2px);
        }

        .cyber-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .cyber-btn-crimson {
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.15) 0%, rgba(200, 0, 60, 0.35) 100%);
            border-color: var(--crimson);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.25);
        }

        .cyber-btn-crimson:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.35) 0%, rgba(200, 0, 60, 0.6) 100%);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.5);
        }

        .cyber-btn-neutral {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
            color: #e2e8f0;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
        }

        .cyber-btn-neutral:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
            color: #ffffff;
        }

        /* Screen Transitions */
        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
            width: 100%;
            height: 100%;
        }

        .screen.active {
            display: flex;
            opacity: 1;
        }

        /* Canvas Wrapper */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
            touch-action: pan-y;
        }

        /* Coin Flip Animation Card */
        .coin-flip-card {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 900;
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            transition: transform 0.08s linear;
            box-shadow: 0 0 30px currentColor;
            padding: 12px;
            text-align: center;
            word-break: break-all;
        }

        /* Toast Animation */
        @keyframes toastPop {
            0% { transform: translate(-50%, -20px) scale(0.9); opacity: 0; }
            15% { transform: translate(-50%, 0) scale(1.05); opacity: 1; }
            85% { transform: translate(-50%, 0) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -10px) scale(0.95); opacity: 0; }
        }

        .toast-animate {
            animation: toastPop 1.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center">

    <!-- 回合與系統提示彈窗 Toast -->

    <!-- 1. HOME SCREEN (模式選擇 - 無名稱輸入框) -->

    <!-- 1.5 LOBBY SCREEN (網路連線準備大廳 - 僅在此設定名稱) -->

                    <p id="my-player-label" class="text-xs font-bold mb-1 truncate">本機玩家: <span id="my-name-display">玩家 A</span></p>

    <!-- 2. COIN TOSS SCREEN -->

        <div class="glass-panel p-10 max-w-md w-full flex flex-col items-center">

            <p class="text-xs text-cyan-400/80 mb-8 tracking-[0.25em] font-['Share_Tech_Mono'] font-bold">DECIDING FIRST MOVE PLAYER</p>
            
            <div id="coin-element" class="coin-flip-card mb-8 bg-black/70 border-4 border-cyan-400 text-cyan-400">

            <div id="coin-result-text" class="text-base sm:text-lg font-bold h-8 tracking-wider text-white font-['Chakra_Petch']"></div>

    <!-- 3. GAME PLAY SCREEN -->

                <span id="ui-turn-text" class="text-xs sm:text-sm md:text-base font-bold tracking-wider text-gray-100 truncate font-['Chakra_Petch','Orbitron']">

            <!-- Top Return Button (僅在同機模式顯示，連線模式中途隱藏) -->
            <button id="top-return-btn" onclick="returnToLobbyOrHome()" class="px-3 py-1 sm:px-4 sm:py-1.5 rounded-lg border border-slate-600/80 bg-slate-800/80 hover:bg-slate-700 text-xs sm:text-sm font-bold text-gray-200 tracking-wider font-['Chakra_Petch'] transition-colors shadow-sm cursor-pointer flex-shrink-0 hover:text-cyan-400">

    <div id="win-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center z-50 p-4">

            <h2 id="modal-winner-title" class="text-2xl md:text-3xl font-black mb-2 text-white font-['Noto_Sans_TC','Orbitron'] truncate max-w-full">
                A方 獲勝！
            </h2>
            <p id="modal-winner-desc" class="text-sm text-gray-300 mb-6 font-medium">成功連通目標邊界</p>

            <div class="flex flex-col space-y-3 w-full">
                <button onclick="downloadRecord()" class="cyber-btn cyber-btn-neutral w-full py-3.5 text-sm flex items-center justify-center font-['Chakra_Petch']">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    下載過程圖 (含顏色與數字)
                </button>
                <button onclick="playAgain()" class="cyber-btn w-full py-3.5 text-sm font-['Chakra_Petch'] tracking-widest tech-glow-white">
                    回到大廳
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // 全局攔截 WebSocket SecurityError，防止 Canvas/Iframe 沙盒報錯阻斷執行
        window.addEventListener('error', (e) => {
            if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('SecurityError'))) {
                console.warn('[Network Shield] 捕捉並處理沙盒 WebSocket 限制:', e.message);
                if (e.preventDefault) e.preventDefault();
                return true;
            }
        });

        const COLORS = {
            bg: '#050811',            
            cyan: '#00f3ff',          
            cyanFill: '#00c8e6',
            crimson: '#ff0055',       
            crimsonFill: '#e6004c',
            purple: '#a855f7',        
            gridLine: 'rgba(168, 85, 247, 0.4)', 
            cellBg: '#090714',        
            hoverGlow: 'rgba(255, 255, 255, 0.3)'
        };

        const GRID_SIZE = 11; // 11x11 Hex Grid
        const TURN_PATTERN = [1, 2, 2, 1]; // 12211221...

        // 本地 BroadcastChannel P2P 轉接器 (當 Canvas/Iframe 沙盒封鎖 WSS WebSocket 時無縫備援)
        class LocalBroadcastP2P {
            constructor(roomId, isHost) {
                this.roomId = roomId;
                this.isHost = isHost;
                this.channel = new BroadcastChannel('hex_core_p2p_' + roomId);
                this.open = true;
                this.dataListeners = [];
                this.closeListeners = [];
                this.openListeners = [];
                this.connectListeners = [];

                this.channel.onmessage = (e) => {
                    const data = e.data;
                    if (!data) return;

                    if (this.isHost && data._signal === 'JOIN_REQ') {
                        this.channel.postMessage({ _signal: 'JOIN_ACK', hostName: customMyName });
                        this.connectListeners.forEach(cb => cb());
                    } else if (!this.isHost && data._signal === 'JOIN_ACK') {
                        if (this.joinTimer) {
                            clearInterval(this.joinTimer);
                            this.joinTimer = null;
                        }
                        if (data.hostName) customOppName = data.hostName;
                        this.openListeners.forEach(cb => cb());
                    } else if (data._signal === 'LEAVE') {
                        this.closeListeners.forEach(cb => cb());
                    } else if (!data._signal) {
                        this.dataListeners.forEach(cb => cb(data));
                    }
                };

                if (!isHost) {
                    this.joinTimer = setInterval(() => {
                        if (this.open) {
                            this.channel.postMessage({ _signal: 'JOIN_REQ', clientName: customMyName });
                        }
                    }, 300);
                }
            }

            send(data) {
                if (this.channel && this.open) {
                    try { this.channel.postMessage(data); } catch(e){}
                }
            }

            on(event, callback) {
                if (event === 'data') this.dataListeners.push(callback);
                if (event === 'close') this.closeListeners.push(callback);
                if (event === 'open') this.openListeners.push(callback);
                if (event === 'connection') this.connectListeners.push(callback);
            }

            close() {
                if (!this.open) return;
                this.open = false;
                if (this.joinTimer) clearInterval(this.joinTimer);
                if (this.channel) {
                    try { this.channel.postMessage({ _signal: 'LEAVE' }); } catch(e){}
                    try { this.channel.close(); } catch(e){}
                    this.channel = null;
                }
                const listeners = [...this.closeListeners];
                this.closeListeners = [];
                listeners.forEach(cb => {
                    try { cb(); } catch(e){}
                });
            }
        }

        // 遊戲與連線模式控制
        let isLocalMode = false; 
        let peer = null;
        let conn = null;
        let myRole = null;        // 'A' (房主/藍) 或 'B' (加入者/紅)
        let customMyName = "";   // 本機自訂連線暱稱 (最多 10 字)
        let customOppName = "";  // 對手自訂連線暱稱
        let myReady = false;
        let oppReady = false;

        // 棋盤狀態變數
        let firstPlayer = 'A'; 
        let moveHistory = [];  
        let boardState = {};   
        let winningPath = null;
        let hoveredCell = null;
        let lastNotifiedTurnPlayer = null; 

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Geometry parameters
        let hexRadius = 24;
        let hexWidth = Math.sqrt(3) * hexRadius;
        let hexHeight = 2 * hexRadius;
        let boardOffsetX = 0;
        let boardOffsetY = 0;

        window.addEventListener('load', () => {
            showScreen('home-screen');
            setupCanvasEvents();
            setupResizeObserver();
            resizeCanvas();
        });

        window.addEventListener('resize', resizeCanvas);

        function setupResizeObserver() {
            const wrapper = document.getElementById('canvas-wrapper');
            if (window.ResizeObserver && wrapper) {
                const ro = new ResizeObserver(() => {
                    resizeCanvas();
                });
                ro.observe(wrapper);
            }
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(id);
            target.classList.add('active');
            if (id === 'game-screen') {
                setTimeout(resizeCanvas, 50);
            }
        }

        // 浮動 Toast 通用提示函數 (取代原生 alert)
        function showNotification(msg, isWarning = false) {
            const toast = document.getElementById('turn-toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = msg;
            toastIcon.innerText = isWarning ? "⚠️" : "⚡";

            if (isWarning) {
                toast.className = "fixed top-14 left-1/2 -translate-x-1/2 bg-amber-500 text-black font-black px-6 py-2.5 rounded-full shadow-[0_0_25px_#f59e0b] opacity-0 pointer-events-none z-50 font-['Orbitron','Noto_Sans_TC'] tracking-widest text-sm sm:text-base flex items-center gap-2 border border-white/50 backdrop-blur-md toast-animate";
            } else {
                toast.className = "fixed top-14 left-1/2 -translate-x-1/2 bg-cyan-400 text-black font-black px-6 py-2.5 rounded-full shadow-[0_0_25px_#00f3ff] opacity-0 pointer-events-none z-50 font-['Orbitron','Noto_Sans_TC'] tracking-widest text-sm sm:text-base flex items-center gap-2 border border-white/50 backdrop-blur-md toast-animate";
            }

            toast.classList.remove('toast-animate');
            void toast.offsetWidth; 
            toast.classList.add('toast-animate');
        }

        // 連線大廳暱稱更新邏輯 (嚴格限制 10 字)
        function updateMyName(val) {
            // 截斷至 10 個字元
            customMyName = val.trim().slice(0, 10);
            
            const input = document.getElementById('lobby-name-input');
            if (input && input.value !== customMyName) {
                input.value = customMyName;
            }

            // 更新字數顯示指標
            const indicator = document.getElementById('name-length-indicator');
            if (indicator) {
                indicator.innerText = `${customMyName.length}/10`;
            }

            updateLobbyRoleUI();

            if (!isLocalMode && conn && conn.open) {
                conn.send({ type: 'UPDATE_NAME', name: customMyName });
            }
        }

        function getPlayerDisplayName(playerRole) {
            // 單機對決模式：直接使用 A方 (藍色) / B方 (紅色)
            if (isLocalMode) {
                return playerRole === 'A' ? 'A方 (藍色)' : 'B方 (紅色)';
            }

            // 多人連線模式：優先使用設定的自訂暱稱，未設定則使用預設角色稱呼
            if (playerRole === myRole) {
                return customMyName || (myRole === 'A' ? 'A方 (藍色)' : 'B方 (紅色)');
            } else {
                return customOppName || (myRole === 'A' ? 'B方 (紅色)' : 'A方 (藍色)');
            }
        }

        // 產生 6 碼大寫英數 ID
        function generateRoomId() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let id = '';
            for (let i = 0; i < 6; i++) {
                id += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return id;
        }

        // --- 同機雙人對戰模式 ---
        function startLocalGame() {
            isLocalMode = true;
            myRole = null;
            customMyName = "";
            customOppName = "";

            const currentConn = conn;
            conn = null;
            if (currentConn) { try { currentConn.close(); } catch(e){} }
            
            const currentPeer = peer;
            peer = null;
            if (currentPeer) { try { currentPeer.destroy(); } catch(e){} }

            const first = Math.random() < 0.5 ? 'A' : 'B';
            runCoinToss(first);
        }

        // --- P2P 網路連線邏輯 ---
        function createRoom() {
            isLocalMode = false;
            document.getElementById('home-status').innerText = '正在建立連線...';
            
            const customId = generateRoomId();
            myRole = 'A'; 
            let peerFailed = false;

            try {
                peer = new Peer(customId); 

                peer.on('open', (id) => {
                    if (peerFailed) return;
                    updateLobbyRoleUI();
                    document.getElementById('display-room-id').innerText = id;
                    showScreen('lobby-screen');
                    document.getElementById('home-status').innerText = '';
                });

                peer.on('connection', (connection) => {
                    conn = connection;
                    setupConnection();
                    document.getElementById('opp-ready-status').innerText = '已連線，未準備';
                    document.getElementById('opp-ready-status').className = 'text-red-500 font-bold text-xs';
                    document.getElementById('btn-ready').disabled = false;

                    if (customMyName) {
                        conn.send({ type: 'UPDATE_NAME', name: customMyName });
                    }
                });

                peer.on('error', (err) => {
                    if (peerFailed) return;
                    console.warn("PeerJS WebSocket 受限，切換至 BroadcastChannel 備援:", err);
                    peerFailed = true;
                    if (peer) { try { peer.destroy(); } catch(e){} peer = null; }
                    startBroadcastRoomHost(customId);
                });
            } catch (err) {
                console.warn("PeerJS 初始化受限，切換至 BroadcastChannel 備援:", err);
                peerFailed = true;
                peer = null;
                startBroadcastRoomHost(customId);
            }
        }

        function startBroadcastRoomHost(customId) {
            conn = new LocalBroadcastP2P(customId, true);
            updateLobbyRoleUI();
            document.getElementById('display-room-id').innerText = customId;
            showScreen('lobby-screen');
            document.getElementById('home-status').innerText = '';
            showNotification('WebSocket 受沙盒限制，已切換至廣播頻道 (BroadcastChannel)');

            conn.on('connection', () => {
                document.getElementById('opp-ready-status').innerText = '已連線，未準備';
                document.getElementById('opp-ready-status').className = 'text-red-500 font-bold text-xs';
                document.getElementById('btn-ready').disabled = false;

                if (customMyName) {
                    conn.send({ type: 'UPDATE_NAME', name: customMyName });
                }

        function joinRoom() {
            isLocalMode = false;
            const roomId = document.getElementById('join-room-id').value.trim().toUpperCase();
            if (!roomId || roomId.length !== 6) {
                showNotification('請輸入有效的 6 碼房間 ID！', true);
                return;
            }
            document.getElementById('home-status').innerText = '正在連線至房間 ' + roomId + '...';
            myRole = 'B';
            let peerFailed = false;

            try {
                peer = new Peer();

                peer.on('open', (id) => {
                    if (peerFailed) return;
                    updateLobbyRoleUI();
                    document.getElementById('display-room-id').innerText = roomId;

                    conn = peer.connect(roomId);
                    conn.on('open', () => {
                        if (peerFailed) return;
                        setupConnection();
                        showScreen('lobby-screen');
                        document.getElementById('opp-ready-status').innerText = '已連線，未準備';
                        document.getElementById('opp-ready-status').className = 'text-red-500 font-bold text-xs';
                        document.getElementById('btn-ready').disabled = false;
                        document.getElementById('home-status').innerText = '';

                        if (customMyName) {
                            conn.send({ type: 'UPDATE_NAME', name: customMyName });
                        }
                    });

                    conn.on('error', (err) => {
                        if (peerFailed) return;
                        console.warn("PeerJS 連線限制，切換至 BroadcastChannel 備援:", err);
                        peerFailed = true;
                        if (peer) { try { peer.destroy(); } catch(e){} peer = null; }
                        startBroadcastRoomClient(roomId);
                    });
                });

                peer.on('error', (err) => {
                    if (peerFailed) return;
                    console.warn("PeerJS 錯誤，切換至 BroadcastChannel 備援:", err);
                    peerFailed = true;
                    if (peer) { try { peer.destroy(); } catch(e){} peer = null; }
                    startBroadcastRoomClient(roomId);
                });

            } catch (err) {
                console.warn("PeerJS 初始化限制，切換至 BroadcastChannel 備援:", err);
                peerFailed = true;
                peer = null;
                startBroadcastRoomClient(roomId);
            }
        }

        function startBroadcastRoomClient(roomId) {
            conn = new LocalBroadcastP2P(roomId, false);
            updateLobbyRoleUI();
            document.getElementById('display-room-id').innerText = roomId;

            conn.on('open', () => {
                setupConnection();
                showScreen('lobby-screen');

                document.getElementById('opp-ready-status').className = 'text-red-500 font-bold text-xs';
                document.getElementById('btn-ready').disabled = false;
                document.getElementById('home-status').innerText = '';

        function copyRoomId() {
            const text = document.getElementById('display-room-id').innerText;
            if (text === '------') return;
            navigator.clipboard.writeText(text);
            showNotification(`房間 ID (${text}) 已複製到剪貼簿！`);
        }

        function setupConnection() {
            conn.on('data', (data) => {
                if (data.type === 'READY') {
                    oppReady = data.status;
                    const statusEl = document.getElementById('opp-ready-status');
                    statusEl.innerText = oppReady ? '已準備' : '未準備';
                    statusEl.className = oppReady ? 'text-green-400 font-bold text-xs' : 'text-red-500 font-bold text-xs';
                    checkBothReady();
                } 
                else if (data.type === 'UPDATE_NAME') {
                    customOppName = (data.name || "").slice(0, 10);
                    updateLobbyRoleUI();
                }
                else if (data.type === 'START_TOSS') {
                    runCoinToss(data.first);
                } 
                else if (data.type === 'MOVE') {
                    makeMove(data.r, data.c, true);
                }
                else if (data.type === 'PLAY_AGAIN') {
                    resetLobby();
                }
            });

            conn.on('close', () => {
                showNotification('對手已斷開連線！', true);
                goHome();
            });
        }

        function toggleReady() {
            myReady = !myReady;
            const statusEl = document.getElementById('my-ready-status');
            statusEl.innerText = myReady ? '已準備' : '未準備';
            statusEl.className = myReady ? 'text-green-400 font-bold text-xs' : 'text-red-500 font-bold text-xs';

            const btn = document.getElementById('btn-ready');
            btn.className = myReady 
                ? "cyber-btn cyber-btn-crimson w-full text-lg py-3.5 font-['Chakra_Petch'] tracking-widest mb-3"
                : "cyber-btn w-full text-lg py-3.5 font-['Chakra_Petch'] tracking-widest tech-glow-white mb-3";
            btn.innerText = myReady ? "取消準備 CANCEL" : "準備完成 READY";

            if (conn && conn.open) {
                conn.send({ type: 'READY', status: myReady });
            }
            checkBothReady();
        }

        function checkBothReady() {
            if (myReady && oppReady && myRole === 'A') {
                const preDeterminedFirst = Math.random() < 0.5 ? 'A' : 'B';
                conn.send({ type: 'START_TOSS', first: preDeterminedFirst });
                runCoinToss(preDeterminedFirst);
            }

            myReady = false;
            oppReady = conn && conn.open;
            document.getElementById('my-ready-status').innerText = '未準備';
            document.getElementById('my-ready-status').className = 'text-red-500 font-bold text-xs';

        // --- 硬幣擲骰動畫與開局 ---
        function runCoinToss(preDeterminedFirst) {
            showScreen('cointoss-screen');
            const coinEl = document.getElementById('coin-element');
            const coinText = document.getElementById('coin-text');
            const resultText = document.getElementById('coin-result-text');

            const nameA = getPlayerDisplayName('A');
            const nameB = getPlayerDisplayName('B');

            resultText.innerText = '';
            let ticks = 0;
            const maxTicks = 20;

            const interval = setInterval(() => {
                ticks++;
                const isATurn = (ticks % 2 === 0);
                
                coinEl.style.transform = `scale(${1 + (ticks % 3) * 0.06}) rotateY(${ticks * 45}deg)`;
                
                if (isATurn) {
                    coinEl.style.borderColor = COLORS.cyan;
                    coinEl.style.color = COLORS.cyan;
                    coinEl.style.boxShadow = `0 0 30px ${COLORS.cyan}`;
                    coinText.innerText = nameA;
                } else {
                    coinEl.style.borderColor = COLORS.crimson;
                    coinEl.style.color = COLORS.crimson;
                    coinEl.style.boxShadow = `0 0 30px ${COLORS.crimson}`;
                    coinText.innerText = nameB;
                }

                if (ticks >= maxTicks) {
                    clearInterval(interval);
                    coinEl.style.transform = 'scale(1) rotateY(0deg)';
                    
                    firstPlayer = preDeterminedFirst;
                    const firstName = (firstPlayer === 'A') ? nameA : nameB;

                    if (firstPlayer === 'A') {
                        coinEl.style.borderColor = COLORS.cyan;
                        coinEl.style.color = COLORS.cyan;
                        coinText.innerText = nameA;
                        resultText.innerText = `⚡ ${firstName} 獲得先攻權 (先手 1)`;
                        resultText.className = 'text-base sm:text-lg font-bold h-8 tracking-wider text-cyan-400 font-["Chakra_Petch"] tech-glow-cyan';
                    } else {
                        coinEl.style.borderColor = COLORS.crimson;
                        coinEl.style.color = COLORS.crimson;
                        coinText.innerText = nameB;
                        resultText.innerText = `⚡ ${firstName} 獲得先攻權 (先手 1)`;
                        resultText.className = 'text-base sm:text-lg font-bold h-8 tracking-wider text-pink-500 font-["Chakra_Petch"] tech-glow-crimson';
                    }

                    setTimeout(() => {
                        startNewMatch();
                    }, 1300);
                }
            }, 90);
        }

        function startNewMatch() {
            moveHistory = [];
            boardState = {};
            winningPath = null;
            lastNotifiedTurnPlayer = null;
            document.getElementById('win-modal').classList.add('hidden');
            
            // 隱藏/顯示中途離開按鈕
            const topReturnBtn = document.getElementById('top-return-btn');
            if (topReturnBtn) {
                if (isLocalMode) {
                    topReturnBtn.style.display = 'block';
                } else {
                    topReturnBtn.style.display = 'none'; // 連線對戰中途禁止返回大廳
                }
            }

            showScreen('game-screen');
            updateUI();
            resizeCanvas();
        }

        function getCurrentStep() {
            return moveHistory.length + 1;
        }

        function getCurrentPlayer() {
            const step = getCurrentStep();
            const patternVal = TURN_PATTERN[(step - 1) % 4];
            const secondPlayer = (firstPlayer === 'A') ? 'B' : 'A';
            return (patternVal === 1) ? firstPlayer : secondPlayer;
        }

        function getRemainingInTurn() {
            const m = moveHistory.length;
            if (m === 0) return 1;
            return (m % 2 === 1) ? 2 : 1;
        }

        function updateUI() {
            const player = getCurrentPlayer();
            const remaining = getRemainingInTurn();
            
            const dot = document.getElementById('ui-turn-dot');
            const text = document.getElementById('ui-turn-text');

            const displayName = getPlayerDisplayName(player);
            let turnTag = "";
            if (!isLocalMode) {
                turnTag = (player === myRole) ? " (你的回合)" : " (對手回合)";
            }

            if (player === 'A') {
                dot.className = "w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full bg-cyan-400 inline-block shadow-[0_0_12px_#00f3ff] flex-shrink-0";
                text.innerHTML = `輪到 <span class="text-cyan-400 font-bold">${displayName}</span>${turnTag} 下子 (剩餘 <span class="font-bold">${remaining}</span> 顆)`;
            } else {
                dot.className = "w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full bg-pink-500 inline-block shadow-[0_0_12px_#ff0055] flex-shrink-0";
                text.innerHTML = `輪到 <span class="text-pink-500 font-bold">${displayName}</span>${turnTag} 下子 (剩餘 <span class="font-bold">${remaining}</span> 顆)`;
            }

            // 輪到玩家時跳出提示彈窗
            if (!winningPath && lastNotifiedTurnPlayer !== player) {
                lastNotifiedTurnPlayer = player;
                if (!isLocalMode) {
                    if (player === myRole) {
                        triggerTurnToast(player);
                    }
                } else {
                    triggerTurnToast(player);
                }
            }
        }

        // --- Canvas Geometry & Rendering ---
        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            if (!wrapper || !wrapper.clientWidth) return;
            
            const w = wrapper.clientWidth;
            const dpr = window.devicePixelRatio || 1;

            const totalWidthUnits = (GRID_SIZE + (GRID_SIZE - 1) * 0.5 + 2.0) * Math.sqrt(3);
            const totalHeightUnits = (GRID_SIZE * 1.5 + 4.2);

            hexRadius = (w * dpr) / totalWidthUnits;
            hexWidth = Math.sqrt(3) * hexRadius;
            hexHeight = 2 * hexRadius;

            const computedHeightInternal = hexRadius * totalHeightUnits;
            const computedHeightCSS = computedHeightInternal / dpr;

            canvas.width = w * dpr;
            canvas.height = computedHeightInternal;

            canvas.style.width = `${w}px`;
            canvas.style.height = `${computedHeightCSS}px`;

            boardOffsetX = (canvas.width - ((GRID_SIZE - 1) * 1.5 * hexWidth)) / 2;
            boardOffsetY = (canvas.height - ((GRID_SIZE - 1) * 1.5 * hexRadius)) / 2;

            drawBoard();
        }

        function getHexCenter(r, c) {
            const x = boardOffsetX + c * hexWidth + r * (hexWidth / 2);
            const y = boardOffsetY + r * (1.5 * hexRadius);
            return { x, y };
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    drawHexCell(r, c);
                }
            }

            drawCoordinateBadges();

            if (winningPath && winningPath.length > 0) {
                drawWinningPath();
            }
        }

        function drawCoordinateBadges() {
            ctx.save();
            const badgeRadius = hexRadius * 0.46;
            const fontSize = Math.max(10, hexRadius * 0.52);
            ctx.font = `700 ${fontSize}px "Share Tech Mono", monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const colLabels = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K'];

            for (let c = 0; c < GRID_SIZE; c++) {
                const topPos = getHexCenter(0, c);
                const topY = topPos.y - hexRadius * 1.45;
                drawBadgeCircle(topPos.x, topY, badgeRadius, colLabels[c], COLORS.crimson);

                const botPos = getHexCenter(GRID_SIZE - 1, c);
                const botY = botPos.y + hexRadius * 1.45;
                drawBadgeCircle(botPos.x, botY, badgeRadius, colLabels[c], COLORS.crimson);
            }

            for (let r = 0; r < GRID_SIZE; r++) {
                const leftPos = getHexCenter(r, 0);
                const leftX = leftPos.x - hexWidth * 0.85;
                drawBadgeCircle(leftX, leftPos.y, badgeRadius, (r + 1).toString(), COLORS.cyan);

                const rightPos = getHexCenter(r, GRID_SIZE - 1);
                const rightX = rightPos.x + hexWidth * 0.85;
                drawBadgeCircle(rightX, rightPos.y, badgeRadius, (r + 1).toString(), COLORS.cyan);
            }

            ctx.restore();
        }

        function drawBadgeCircle(x, y, radius, text, color) {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = COLORS.cellBg;
            ctx.fill();

            ctx.lineWidth = Math.max(1, radius * 0.16);
            ctx.strokeStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 6;
            ctx.stroke();

            ctx.shadowBlur = 4;
            ctx.fillStyle = color;
            ctx.fillText(text, x, y + 1);
            ctx.shadowBlur = 0;
        }

        function drawHexCell(r, c) {
            const { x, y } = getHexCenter(r, c);
            const key = `${r},${c}`;
            const cellData = boardState[key];
            const isHovered = hoveredCell && hoveredCell.r === r && hoveredCell.c === c && !cellData && (isLocalMode || getCurrentPlayer() === myRole);

            ctx.save();
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 180) * (60 * i - 30);
                const px = x + hexRadius * Math.cos(angle);
                const py = y + hexRadius * Math.sin(angle);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();

            if (cellData) {
                const isPlayerA = (cellData.color === 'A');
                const fillColor = isPlayerA ? COLORS.cyan : COLORS.crimson;

                ctx.fillStyle = fillColor;
                ctx.fill();

                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 5;
                ctx.fillStyle = '#ffffff';
                ctx.font = `900 ${hexRadius * 0.68}px Orbitron, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(cellData.step, x, y + 1);

            } else if (isHovered) {
                const curPlayer = getCurrentPlayer();
                ctx.fillStyle = (curPlayer === 'A') ? 'rgba(0, 243, 255, 0.25)' : 'rgba(255, 0, 85, 0.25)';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = (curPlayer === 'A') ? COLORS.cyan : COLORS.crimson;
                ctx.stroke();
            } else {
                ctx.fillStyle = COLORS.cellBg;
                ctx.fill();
                ctx.lineWidth = Math.max(1, hexRadius * 0.05);
                ctx.strokeStyle = COLORS.gridLine;
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawWinningPath() {
            if (!winningPath || winningPath.length < 2) return;

            ctx.save();
            ctx.beginPath();
            winningPath.forEach((pt, index) => {
                const { x, y } = getHexCenter(pt.r, pt.c);
                if (index === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });

            ctx.lineWidth = Math.max(3, hexRadius * 0.2);
            ctx.strokeStyle = '#ffffff';
            ctx.shadowColor = '#ffff00';
            ctx.shadowBlur = 18;
            ctx.stroke();

            winningPath.forEach(pt => {
                const { x, y } = getHexCenter(pt.r, pt.c);
                ctx.beginPath();
                ctx.arc(x, y, Math.max(3, hexRadius * 0.2), 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            });

            ctx.restore();
        }

        // --- 控制輸入處理 ---
        function setupCanvasEvents() {
            let touchStartX = 0;
            let touchStartY = 0;
            let isTouchMove = false;

            function getEventPos(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else if (e.changedTouches && e.changedTouches.length > 0) {
                    clientX = e.changedTouches[0].clientX;
                    clientY = e.changedTouches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }

            function handleMove(e) {
                const pos = getEventPos(e);
                const found = findNearestHex(pos.x, pos.y);
                if (found !== hoveredCell) {
                    hoveredCell = found;
                    drawBoard();
                }
            }

            function handleClick(e) {
                if (!isLocalMode && getCurrentPlayer() !== myRole) return; 

                const pos = getEventPos(e);
                const hex = findNearestHex(pos.x, pos.y);
                if (hex) {
                    makeMove(hex.r, hex.c, false);
                }
            }

            canvas.addEventListener('mousemove', handleMove);
            canvas.addEventListener('click', handleClick);

            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    isTouchMove = false;
                }
            }, { passive: true });

            canvas.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) {
                    const dx = Math.abs(e.touches[0].clientX - touchStartX);
                    const dy = Math.abs(e.touches[0].clientY - touchStartY);
                    if (dx > 10 || dy > 10) {
                        isTouchMove = true;
                    }
                }
            }, { passive: true });

            canvas.addEventListener('touchend', (e) => {
                if (!isTouchMove) {
                    handleClick(e);
                }
            });
        }

        function findNearestHex(mx, my) {
            let minDistance = Infinity;
            let nearest = null;

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const { x, y } = getHexCenter(r, c);
                    const dist = Math.hypot(mx - x, my - y);
                    if (dist < hexRadius * 0.95 && dist < minDistance) {
                        minDistance = dist;
                        nearest = { r, c };
                    }
                }
            }
            return nearest;
        }

        // --- 遊戲邏輯與 BFS 勝利判斷 ---
        function makeMove(r, c, isRemote = false) {
            if (winningPath) return; 
            const key = `${r},${c}`;
            if (boardState[key]) return; 

            const step = getCurrentStep();
            const player = getCurrentPlayer();

            if (!isLocalMode && !isRemote && conn && conn.open) {
                conn.send({ type: 'MOVE', r: r, c: c });
            }

            boardState[key] = { color: player, step };
            moveHistory.push({ r, c, color: player, step });

            updateUI();
            drawBoard();

            const winPath = checkWin(player);
            if (winPath) {
                winningPath = winPath;
                drawBoard();

                setTimeout(() => {
                    triggerGameOver(player, winPath);
                }, 400);
            }
        }

        function getNeighbors(r, c) {
            const neighbors = [
                { r: r,     c: c - 1 }, 
                { r: r,     c: c + 1 }, 
                { r: r - 1, c: c     }, 
                { r: r - 1, c: c + 1 }, 
                { r: r + 1, c: c - 1 }, 
                { r: r + 1, c: c     }  
            ];
            return neighbors.filter(n => n.r >= 0 && n.r < GRID_SIZE && n.c >= 0 && n.c < GRID_SIZE);
        }

        function checkWin(player) {
            const queue = [];
            const visited = new Set();
            const parentMap = {};

            if (player === 'B') {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const key = `0,${c}`;
                    if (boardState[key] && boardState[key].color === 'B') {
                        queue.push({ r: 0, c });
                        visited.add(key);
                    }
                }
            } else { 
                for (let r = 0; r < GRID_SIZE; r++) {
                    const key = `${r},0`;
                    if (boardState[key] && boardState[key].color === 'A') {
                        queue.push({ r, c: 0 });
                        visited.add(key);
                    }
                }
            }

            while (queue.length > 0) {
                const curr = queue.shift();
                const currKey = `${curr.r},${curr.c}`;

                if ((player === 'B' && curr.r === GRID_SIZE - 1) ||
                    (player === 'A' && curr.c === GRID_SIZE - 1)) {
                    
                    const path = [curr];
                    let pKey = currKey;
                    while (parentMap[pKey]) {
                        const parent = parentMap[pKey];
                        path.unshift(parent);
                        pKey = `${parent.r},${parent.c}`;
                    }
                    return path;
                }

                const neighbors = getNeighbors(curr.r, curr.c);
                for (let n of neighbors) {
                    const nKey = `${n.r},${n.c}`;
                    if (!visited.has(nKey) && boardState[nKey] && boardState[nKey].color === player) {
                        visited.add(nKey);
                        parentMap[nKey] = curr;
                        queue.push(n);
                    }
                }
            }

            return null;
        }

        // --- 結算與功能選項 ---
        function triggerGameOver(winner, path) {
            const modal = document.getElementById('win-modal');
            const titleEl = document.getElementById('modal-winner-title');
            const descEl = document.getElementById('modal-winner-desc');

            const winnerName = getPlayerDisplayName(winner);

            if (winner === 'A') {
                titleEl.innerText = `${winnerName} 獲勝！`;
                titleEl.className = 'text-2xl md:text-3xl font-black mb-2 text-cyan-400 font-["Chakra_Petch"] tech-glow-cyan truncate max-w-full';
                descEl.innerText = 'SYSTEM CONNECTED: LEFT ➔ RIGHT';
            } else {
                titleEl.innerText = `${winnerName} 獲勝！`;
                titleEl.className = 'text-2xl md:text-3xl font-black mb-2 text-pink-500 font-["Chakra_Petch"] tech-glow-crimson truncate max-w-full';
                descEl.innerText = 'SYSTEM CONNECTED: TOP ➔ BOTTOM';
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function downloadRecord() {
            drawBoard();
            const imageURL = canvas.toDataURL('image/png');
            const downloadLink = document.createElement('a');
            downloadLink.download = `HEX_CORE_MATCH_${Date.now()}.png`;
            downloadLink.href = imageURL;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        function playAgain() {
            if (isLocalMode) {
                startLocalGame();
            } else {
                if (conn && conn.open) {
                    conn.send({ type: 'PLAY_AGAIN' });
                }
                resetLobby();
            }
        }

        function returnToLobbyOrHome() {
            if (isLocalMode) {
                goHome();
            } else {
                resetLobby();
            }
        }

        function goHome() {
            const currentConn = conn;
            conn = null;
            if (currentConn) {
                try { currentConn.close(); } catch(e){}
            }

            const currentPeer = peer;
            peer = null;
            if (currentPeer) {
                try { currentPeer.destroy(); } catch(e){}
            }

            document.getElementById('win-modal').classList.add('hidden');
            showScreen('home-screen');
        }
    </script>
