<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX CORE - 11x11 Tactical Neon Grid</title>
    <!-- Sci-Fi Google Fonts & Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&family=Noto+Sans+TC:wght@600;700;900&display=swap" rel="stylesheet">
    
    <!-- PeerJS SDK (WebRTC P2P Direct Connection) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <!-- MQTT Over WebSocket SDK (Fallback Relay Channel) -->
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #050811;
            --cyan: #00f3ff;
            --cyan-glow: rgba(0, 243, 255, 0.6);
            --crimson: #ff0055;
            --crimson-glow: rgba(255, 0, 85, 0.6);
            --panel-bg: rgba(13, 19, 35, 0.85);
            --border-line: rgba(0, 243, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Chakra Petch', 'Rajdhani', 'Noto Sans TC', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            width: 100vw;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 243, 255, 0.05) 0%, transparent 65%),
                radial-gradient(circle at 50% 80%, rgba(255, 0, 85, 0.05) 0%, transparent 65%),
                linear-gradient(to bottom, #040710 0%, #070c1b 100%);
        }

        /* Sci-Fi Text Glow Classes */
        .tech-glow-cyan {
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.8), 0 0 18px rgba(0, 243, 255, 0.4);
        }

        .tech-glow-crimson {
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.8), 0 0 18px rgba(255, 0, 85, 0.4);
        }

        .tech-glow-white {
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.7), 0 0 15px rgba(0, 243, 255, 0.3);
        }

        /* Glassmorphism containers */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            border-radius: 16px;
        }

        /* Cyberpunk Button Styling */
        .cyber-btn {
            position: relative;
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.15) 0%, rgba(0, 150, 255, 0.35) 100%);
            border: 1px solid var(--cyan);
            color: #ffffff;
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 12px 28px;
            border-radius: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.25);
            cursor: pointer;
        }

        .cyber-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.35) 0%, rgba(0, 150, 255, 0.6) 100%);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
            transform: translateY(-2px);
        }

        .cyber-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .cyber-btn-crimson {
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.15) 0%, rgba(200, 0, 60, 0.35) 100%);
            border-color: var(--crimson);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.25);
        }

        .cyber-btn-crimson:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.35) 0%, rgba(200, 0, 60, 0.6) 100%);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.5);
        }

        .cyber-btn-neutral {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
            color: #e2e8f0;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
        }

        .cyber-btn-neutral:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
            color: #ffffff;
        }

        /* Screen Transitions */
        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
            width: 100%;
            height: 100%;
        }

        .screen.active {
            display: flex !important;
            opacity: 1 !important;
        }

        /* Canvas Wrapper */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
            touch-action: pan-y;
        }

        /* Coin Flip Animation Card */
        .coin-flip-card {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 900;
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            transition: transform 0.08s linear;
            box-shadow: 0 0 30px currentColor;
            padding: 10px;
            text-align: center;
        }

        /* Toast Animation */
        @keyframes toastPop {
            0% { transform: translate(-50%, -20px) scale(0.9); opacity: 0; }
            15% { transform: translate(-50%, 0) scale(1.05); opacity: 1; }
            85% { transform: translate(-50%, 0) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -10px) scale(0.95); opacity: 0; }
        }

        .toast-animate {
            animation: toastPop 1.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center">

    <!-- 回合與系統提示彈窗 Toast -->
    <div id="turn-toast" style="display: none;" class="fixed top-14 left-1/2 -translate-x-1/2 bg-cyan-500/90 text-black font-black px-6 py-2.5 rounded-full shadow-[0_0_25px_#00f3ff] opacity-0 pointer-events-none z-50 font-['Orbitron','Noto_Sans_TC'] tracking-widest text-sm sm:text-base flex items-center gap-2 border border-white/50 backdrop-blur-md">
        <span id="toast-icon">⚡</span>
        <span id="toast-msg">輪到 A 的回合！</span>
    </div>

    <!-- 1. HOME SCREEN (模式選擇) -->
    <div id="home-screen" class="screen active flex-col items-center justify-center text-center p-6 w-full h-full relative z-10">
        <div class="glass-panel p-8 md:p-10 max-w-lg w-full flex flex-col items-center border-t-2 border-cyan-400 relative z-20">
            <h1 class="text-4xl md:text-6xl font-black tracking-[0.2em] mb-2 text-white font-['Orbitron'] tech-glow-cyan">
                HEX CORE
            </h1>
            <p class="text-xs md:text-base text-cyan-300/80 tracking-[0.3em] mb-8 font-['Share_Tech_Mono'] font-bold">11x11 NEON TACTICAL GRID</p>

            <div class="w-full flex flex-col space-y-4">
                <!-- 同機對戰選項 (單機對決) -->
                <button onclick="startLocalGame()" class="cyber-btn cyber-btn-neutral w-full text-base py-4 font-['Chakra_Petch'] tracking-widest cursor-pointer relative z-30">
                    🎮 同機雙人對戰 (單機對決)
                </button>

                <div class="flex items-center my-2">
                    <div class="flex-grow border-t border-slate-700"></div>
                    <span class="px-3 text-xs text-gray-400 font-['Share_Tech_Mono']">ONLINE P2P 網路連線</span>
                    <div class="flex-grow border-t border-slate-700"></div>
                </div>

                <!-- 網路開房與加入選項 -->
                <button onclick="createRoom()" class="cyber-btn w-full text-base py-3.5 font-['Chakra_Petch'] tracking-widest tech-glow-white cursor-pointer relative z-30">
                    🌐 創建網路房間 (6碼 ID)
                </button>
                <div class="flex items-center space-x-2">
                    <input type="text" id="join-room-id" maxlength="6" placeholder="輸入 6 碼大寫 ID" oninput="this.value = this.value.toUpperCase()" onkeyup="this.value = this.value.toUpperCase()" class="w-2/3 bg-black/50 border border-cyan-400/50 text-cyan-400 p-3 rounded text-center font-['Share_Tech_Mono'] tracking-widest text-lg outline-none focus:border-cyan-400 uppercase">
                    <button onclick="joinRoom()" class="cyber-btn cyber-btn-crimson w-1/3 text-sm py-3.5 font-['Chakra_Petch'] tracking-widest cursor-pointer relative z-30">
                        加入房間
                    </button>
                </div>
            </div>
            <p id="home-status" class="mt-4 text-cyan-400 font-bold font-['Noto_Sans_TC'] text-sm min-h-[20px]"></p>
        </div>
    </div>

    <!-- 1.5 LOBBY SCREEN (網路連線準備大廳 - 僅在此處設定名稱) -->
    <div id="lobby-screen" class="screen flex-col items-center justify-center text-center p-6 w-full h-full relative z-10">
        <div class="glass-panel p-8 max-w-md w-full flex flex-col items-center border-t-2 border-purple-500 relative z-20">
            <h2 class="text-2xl font-bold tracking-[0.2em] text-white mb-4 font-['Orbitron'] tech-glow-white">連線大廳</h2>
            
            <div class="bg-black/40 border border-slate-700/60 rounded-xl p-4 w-full mb-5 text-center">
                <span class="text-xs text-gray-400 uppercase tracking-[0.25em] block mb-1 font-['Share_Tech_Mono']">房間 ID (點擊複製傳給對手)</span>
                <span id="display-room-id" onclick="copyRoomId()" class="text-2xl font-black text-cyan-400 tracking-[0.25em] font-['Share_Tech_Mono'] tech-glow-cyan cursor-pointer select-all">------</span>
            </div>

            <!-- 多人連線專屬：設定/修改暱稱 (限制 10 字以內) -->
            <div class="w-full mb-5 text-left bg-black/40 border border-purple-500/40 p-3.5 rounded-xl">
                <div class="flex justify-between items-center mb-1.5">
                    <label class="text-xs text-purple-300 font-bold font-['Share_Tech_Mono'] tracking-wider">👤 設定玩家名稱 (限制 10 字)</label>
                    <span id="name-char-count" class="text-xs text-purple-400/80 font-['Share_Tech_Mono']">0/10</span>
                </div>
                <input type="text" id="lobby-name-input" maxlength="10" placeholder="請輸入你的暱稱 (最多10字)" oninput="updateMyName(this.value)" class="w-full bg-black/60 border border-purple-400/50 text-purple-200 p-2.5 rounded font-['Chakra_Petch'] outline-none focus:border-purple-400 text-sm tracking-wide">
            </div>

            <!-- 本機玩家與對手玩家 標籤與顏色對應 -->
            <div class="w-full flex justify-between px-3 mb-6 bg-black/30 p-3.5 rounded-lg border border-slate-800">
                <div class="text-left max-w-[48%]">
                    <p id="my-player-label" class="text-sm font-bold mb-1 truncate">本機玩家: <span id="my-name-display">玩家 A</span></p>
                    <span id="my-role-badge" class="text-xs px-2 py-0.5 rounded font-bold inline-block mb-1">A方 (藍)</span><br>
                    <span id="my-ready-status" class="text-red-500 font-bold text-xs">未準備</span>
                </div>
                <div class="text-right max-w-[48%]">
                    <p id="opp-player-label" class="text-sm font-bold mb-1 truncate">對手玩家: <span id="opp-name-display">等待連線...</span></p>
                    <span id="opp-role-badge" class="text-xs px-2 py-0.5 rounded font-bold inline-block mb-1">B方 (紅)</span><br>
                    <span id="opp-ready-status" class="text-red-500 font-bold text-xs">等待連線</span>
                </div>
            </div>

            <button id="btn-ready" onclick="toggleReady()" class="cyber-btn w-full text-lg py-3.5 font-['Chakra_Petch'] tracking-widest tech-glow-white mb-3 cursor-pointer" disabled>
                準備完成 READY
            </button>

            <!-- 在大廳才可以離開房間 -->
            <button onclick="goHome()" class="cyber-btn cyber-btn-neutral w-full text-sm py-3 font-['Chakra_Petch'] tracking-widest cursor-pointer">
                🚪 離開房間 LEAVE ROOM
            </button>
        </div>
    </div>

    <!-- 2. COIN TOSS SCREEN -->
    <div id="cointoss-screen" class="screen flex-col items-center justify-center text-center p-6 w-full h-full relative z-10">
        <div class="glass-panel p-10 max-w-md w-full flex flex-col items-center">
            <h2 class="text-xl font-bold tracking-[0.2em] text-gray-200 mb-2 font-['Orbitron'] tech-glow-white">COIN FLIP PROTOCOL</h2>
            <p class="text-xs text-cyan-400/80 mb-8 tracking-[0.25em] font-['Share_Tech_Mono'] font-bold">DECIDING FIRST MOVE PLAYER</p>
            
            <div id="coin-element" class="coin-flip-card mb-8 bg-black/70 border-4 border-cyan-400 text-cyan-400">
                <span id="coin-text" class="font-['Orbitron'] truncate max-w-full">READY</span>
            </div>

            <div id="coin-result-text" class="text-base sm:text-lg font-bold h-8 tracking-wider text-white font-['Chakra_Petch']"></div>
        </div>
    </div>

    <!-- 3. GAME PLAY SCREEN -->
    <div id="game-screen" class="screen flex-col items-center justify-start py-2 sm:py-3 px-2 sm:px-4 w-full min-h-screen overflow-x-hidden overflow-y-auto max-w-5xl relative z-10">
        <!-- Top Status Bar -->
        <div class="w-full max-w-[840px] px-3 py-2 sm:px-4 sm:py-2.5 flex items-center justify-between gap-2 mb-2 border border-slate-700/60 rounded-xl bg-[#0c1222]/90 backdrop-blur-md shadow-lg flex-shrink-0 sticky top-2 z-20">
            <!-- Turn Status Indicator -->
            <div class="flex items-center space-x-2 sm:space-x-3 min-w-0">
                <span id="ui-turn-dot" class="w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full bg-pink-500 inline-block shadow-[0_0_12px_#ff0055] flex-shrink-0"></span>
                <span id="ui-turn-text" class="text-xs sm:text-sm md:text-base font-bold tracking-wider text-gray-100 truncate font-['Chakra_Petch','Orbitron']">
                    等待對局開始...
                </span>
            </div>

            <!-- Top Return Button (僅在同機模式顯示) -->
            <button id="top-return-btn" onclick="returnToLobbyOrHome()" class="px-3 py-1 sm:px-4 sm:py-1.5 rounded-lg border border-slate-600/80 bg-slate-800/80 hover:bg-slate-700 text-xs sm:text-sm font-bold text-gray-200 tracking-wider font-['Chakra_Petch'] transition-colors shadow-sm cursor-pointer flex-shrink-0 hover:text-cyan-400">
                離開對局
            </button>
        </div>

        <!-- Center Interactive Parallelogram Canvas -->
        <div id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>
    </div>

    <!-- 4. GAME OVER MODAL -->
    <div id="win-modal" style="display: none;" class="fixed inset-0 bg-black/80 backdrop-blur-md items-center justify-center z-50 p-4">
        <div class="glass-panel p-8 max-w-md w-full flex flex-col items-center text-center border-t-4 border-cyan-400 animate-fade-in">
            <div class="text-xs text-cyan-400 tracking-widest font-bold mb-2 font-['Orbitron']">MATCH COMPLETED</div>
            <h2 id="modal-winner-title" class="text-2xl md:text-3xl font-black mb-2 text-white font-['Noto_Sans_TC','Orbitron'] truncate max-w-full">
                A方 獲勝！
            </h2>
            <p id="modal-winner-desc" class="text-sm text-gray-300 mb-6 font-medium">成功連通目標邊界</p>

            <div class="flex flex-col space-y-3 w-full">
                <button onclick="downloadRecord()" class="cyber-btn cyber-btn-neutral w-full py-3.5 text-sm flex items-center justify-center font-['Chakra_Petch'] cursor-pointer">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    下載過程圖 (含顏色與數字)
                </button>
                <button onclick="playAgain()" class="cyber-btn w-full py-3.5 text-sm font-['Chakra_Petch'] tracking-widest tech-glow-white cursor-pointer">
                    回到大廳
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // 全局攔截 WebSocket SecurityError 與 UnhandledRejection，防止沙盒網路限制阻斷執行
        window.addEventListener('error', (e) => {
            if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('SecurityError'))) {
                console.warn('[Network Shield] 捕捉沙盒網路限制:', e.message);
                if (e.preventDefault) e.preventDefault();
                return true;
            }
        });

        window.addEventListener('unhandledrejection', (e) => {
            const reason = e.reason ? (e.reason.message || String(e.reason)) : String(e);
            if (reason.includes('WebSocket') || reason.includes('SecurityError') || reason.includes('Canvas')) {
                console.warn('[Network Shield] 捕捉沙盒 WebSocket Unhandled Rejection:', reason);
                e.preventDefault();
                return true;
            }
        });

        // 強化 WebRTC ICE 穿透設定 (含 STUN + 免費 TURN 伺服器)
        const PEER_OPTIONS = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' },
                    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelay', credential: 'openrelay' },
                    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelay', credential: 'openrelay' },
                    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelay', credential: 'openrelay' }
                ],
                iceCandidatePoolSize: 10
            }
        };

        const COLORS = {
            bg: '#050811',            
            cyan: '#00f3ff',          
            cyanFill: '#00c8e6',
            crimson: '#ff0055',       
            crimsonFill: '#e6004c',
            purple: '#a855f7',        
            gridLine: 'rgba(168, 85, 247, 0.4)', 
            cellBg: '#090714',        
            hoverGlow: 'rgba(255, 255, 255, 0.3)'
        };

        const GRID_SIZE = 11; // 11x11 Hex Grid
        const TURN_PATTERN = [1, 2, 2, 1]; // 12211221...

        // 遊戲與連線模式控制
        let isLocalMode = false; 
        let peer = null;
        let conn = null;
        let myRole = null;        // 'A' (房主/藍) 或 'B' (加入者/紅)
        let customMyName = "";   // 多人連線自訂暱稱 (限制10字)
        let customOppName = "";  // 對手自訂暱稱
        let myReady = false;
        let oppReady = false;

        // 棋盤狀態變數
        let firstPlayer = 'A'; 
        let moveHistory = [];  
        let boardState = {};   
        let winningPath = null;
        let hoveredCell = null;
        let lastNotifiedTurnPlayer = null; 
        let joinTimeoutTimer = null;
        let createTimeoutTimer = null;
        let emptyRoomTimer = null;         // 10 分鐘空房自動關閉計時器
        let isOpponentConnected = false;   // 標記對手是否已加入連線

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Geometry parameters
        let hexRadius = 24;
        let hexWidth = Math.sqrt(3) * hexRadius;
        let hexHeight = 2 * hexRadius;
        let boardOffsetX = 0;
        let boardOffsetY = 0;

        window.addEventListener('load', () => {
            showScreen('home-screen');
            setupCanvasEvents();
            setupResizeObserver();
            resizeCanvas();
        });

        window.addEventListener('resize', resizeCanvas);

        function setupResizeObserver() {
            const wrapper = document.getElementById('canvas-wrapper');
            if (window.ResizeObserver && wrapper) {
                const ro = new ResizeObserver(() => {
                    resizeCanvas();
                });
                ro.observe(wrapper);
            }
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active');
                s.style.display = 'none';
            });
            const target = document.getElementById(id);
            if (target) {
                target.style.display = 'flex';
                target.classList.add('active');
            }
            if (id === 'game-screen') {
                setTimeout(resizeCanvas, 50);
            }
        }

        // 核心網路與連線徹底清理函式 (修復離線再開房連線遺留問題)
        function cleanupNetwork() {
            // 1. 取消任何運行中的逾時計時器
            if (createTimeoutTimer) {
                clearTimeout(createTimeoutTimer);
                createTimeoutTimer = null;
            }
            if (joinTimeoutTimer) {
                clearTimeout(joinTimeoutTimer);
                joinTimeoutTimer = null;
            }
            if (emptyRoomTimer) {
                clearTimeout(emptyRoomTimer);
                emptyRoomTimer = null;
            }
            isOpponentConnected = false;

            // 2. 斷開與解綁數據連線
            if (conn) {
                try {
                    if (typeof conn.off === 'function') {
                        conn.off('data');
                        conn.off('close');
                        conn.off('error');
                    }
                    if (typeof conn.close === 'function') {
                        conn.close();
                    }
                } catch (e) {
                    console.warn('[Cleanup] Connection close error:', e);
                }
                conn = null;
            }

            // 3. 銷毀 PeerJS 實例
            if (peer) {
                try {
                    if (typeof peer.off === 'function') {
                        peer.off('open');
                        peer.off('connection');
                        peer.off('error');
                        peer.off('close');
                    }
                    if (peer.disconnected === false && typeof peer.disconnect === 'function') {
                        peer.disconnect();
                    }
                    if (typeof peer.destroy === 'function') {
                        peer.destroy();
                    }
                } catch (e) {
                    console.warn('[Cleanup] Peer destroy error:', e);
                }
                peer = null;
            }

            // 4. 重置變數狀態
            myRole = null;
            myReady = false;
            oppReady = false;
            customOppName = "";
            lastNotifiedTurnPlayer = null;

            // 5. 重置大廳與首頁 UI 狀態
            const roomIdEl = document.getElementById('display-room-id');
            if (roomIdEl) roomIdEl.innerText = '------';

            const myReadyStatus = document.getElementById('my-ready-status');
            if (myReadyStatus) {
                myReadyStatus.innerText = '未準備';

        // --- MQTT Over WebSocket 雲端中繼轉接器 ---
        class MqttRelayP2P {
            constructor(roomId, isHost) {
                this.roomId = roomId;
                this.isHost = isHost;
                this.open = false;
                this.messageListeners = [];
                this.closeListeners = [];

                const myTopic = isHost ? `hexcore/room/${roomId}/host` : `hexcore/room/${roomId}/client`;
                const oppTopic = isHost ? `hexcore/room/${roomId}/client` : `hexcore/room/${roomId}/host`;
                this.oppTopic = oppTopic;

                try {
                    if (typeof mqtt !== 'undefined') {
                        const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
                        this.client = mqtt.connect(brokerUrl, {
                            keepalive: 30,
                            clientId: 'hex_' + (isHost ? 'H_' : 'C_') + Math.random().toString(16).substring(2, 8)
                        });

                        this.client.on('connect', () => {
                            this.open = true;
                            this.client.subscribe(oppTopic);
                            console.log(`[MQTT 中繼站] 成功連線，訂閱主題: ${oppTopic}`);
                        });

                        this.client.on('message', (topic, message) => {
                            if (topic === this.oppTopic && this.open) {
                                try {
                                    const payload = JSON.parse(message.toString());
                                    this.messageListeners.forEach(fn => fn(payload));
                                } catch(e) {}
                            }
                        });

                        this.client.on('error', (err) => {
                            console.warn('[MQTT 中繼站] 錯誤:', err);
                        });

                        this.client.on('close', () => {
                            this.open = false;
                        });
                    }
                } catch (err) {
                    console.warn('[MQTT 中繼站] WebSocket 沙盒阻擋限制:', err);
                }
            }

            send(payload) {
                if (!this.open || !this.client) return;
                const targetTopic = this.isHost ? `hexcore/room/${this.roomId}/client` : `hexcore/room/${this.roomId}/host`;
                try {
                    this.client.publish(targetTopic, JSON.stringify(payload));
                } catch(e) {}
            }

            on(event, callback) {
                if (event === 'data') this.messageListeners.push(callback);
                if (event === 'close') this.closeListeners.push(callback);
            }

            close() {
                this.open = false;
                if (this.client) {
                    try { this.client.end(); } catch(e){}
                }
                const listeners = [...this.closeListeners];
                this.closeListeners = [];
                listeners.forEach(fn => fn());
            }
        }

        // --- 本地 BroadcastChannel 備援 (當所有 WebSocket / WebRTC 在 Canvas 沙盒中被禁時使用) ---
        class LocalBroadcastP2P {
            constructor(roomId, isHost) {
                this.roomId = roomId;
                this.isHost = isHost;
                this.open = true;
                this.messageListeners = [];
                this.closeListeners = [];
                this.channelSend = `hexcore_room_${roomId}_${isHost ? 'H2C' : 'C2H'}`;
                this.channelListen = `hexcore_room_${roomId}_${isHost ? 'C2H' : 'H2C'}`;

                try {
                    if (typeof BroadcastChannel !== 'undefined') {
                        this.bcSend = new BroadcastChannel(this.channelSend);
                        this.bcListen = new BroadcastChannel(this.channelListen);
                        this.bcListen.onmessage = (e) => {
                            if (this.open && e.data) {
                                this.messageListeners.forEach(fn => fn(e.data));
                            }
                        };
                    }
                } catch(e) {
                    console.warn('[Local Broadcast] 沙盒限制 BroadcastChannel:', e);
                }
            }

            send(payload) {
                if (!this.open || !this.bcSend) return;
                try {
                    this.bcSend.postMessage(payload);
                } catch(e) {}
            }

            on(event, callback) {
                if (event === 'data') this.messageListeners.push(callback);
                if (event === 'close') this.closeListeners.push(callback);
            }

            close() {
                this.open = false;
                if (this.bcSend) { try { this.bcSend.close(); } catch(e){} }
                if (this.bcListen) { try { this.bcListen.close(); } catch(e){} }
                const listeners = [...this.closeListeners];
                this.closeListeners = [];
                listeners.forEach(fn => fn());
            }
        }

        // --- P2P 網路連線邏輯 ---
        function createRoom() {
            cleanupNetwork(); // 開設新房間前徹底清理舊狀態
            isLocalMode = false;
            document.getElementById('home-status').innerText = '正在建立連線...';
            
            const customId = generateRoomId();
            myRole = 'A'; 
            let connectionEstablished = false;

            createTimeoutTimer = setTimeout(() => {
                const roomIdDisplay = document.getElementById('display-room-id');
                if (!roomIdDisplay || roomIdDisplay.innerText === '------') {
                    document.getElementById('home-status').innerText = '❌ 建立房間連線超時，請重試';
                    showNotification('建立房間超時，請檢查網路狀態！', 'error');
                    goHome();
                }
            }, 8000);

            const fallbackToMqtt = () => {
                if (connectionEstablished) return;
                console.log("[網絡備援] 自動切換至中繼連線");
                if (peer) { try { peer.destroy(); } catch(e){} peer = null; }
                
                try {
                    conn = new MqttRelayP2P(customId, true);
                } catch(e) {
                    conn = new LocalBroadcastP2P(customId, true);
                }

                setTimeout(() => {
                    if (conn && !conn.open && !(conn instanceof LocalBroadcastP2P)) {
                        console.log("[網絡備援] 切換至 Local BroadcastChannel 模式");
                        try { conn.close(); } catch(e){}
                        conn = new LocalBroadcastP2P(customId, true);
                        setupConnection();
                    }
                }, 1000);

                setupConnection();
                updateLobbyRoleUI();
                document.getElementById('display-room-id').innerText = customId;
                showScreen('lobby-screen');
                startEmptyRoomTimer();
                document.getElementById('home-status').innerText = '已啟用通訊頻道';
                document.getElementById('opp-ready-status').innerText = '已連線，未準備';
                document.getElementById('opp-ready-status').className = 'text-red-500 font-bold text-xs';
                document.getElementById('btn-ready').disabled = false;
            };

            if (typeof Peer === 'undefined') {
                fallbackToMqtt();
                return;
            }

            try {
                peer = new Peer(customId, PEER_OPTIONS); 

                peer.on('open', (id) => {
                    if (createTimeoutTimer) clearTimeout(createTimeoutTimer);
                    updateLobbyRoleUI();
                    document.getElementById('display-room-id').innerText = id;
                    showScreen('lobby-screen');
                    startEmptyRoomTimer();
                    document.getElementById('home-status').innerText = '';
                });

                peer.on('connection', (connection) => {
                    connectionEstablished = true;
                    isOpponentConnected = true;
                    if (emptyRoomTimer) {
                        clearTimeout(emptyRoomTimer);
                        emptyRoomTimer = null;
                    }
                    conn = connection;
                    setupConnection();
                    document.getElementById('opp-ready-status').innerText = '已連線，未準備';
                    document.getElementById('opp-ready-status').className = 'text-red-500 font-bold text-xs';
                    document.getElementById('btn-ready').disabled = false;

                    if (customMyName) {
                        conn.send({ type: 'UPDATE_NAME', name: customMyName });
                    }
                });

                peer.on('error', (err) => {
                    console.warn("WebRTC P2P 穿透受限，啟動 MQTT 雲端中繼備援:", err);
                    fallbackToMqtt();
                });

            } catch (err) {
                console.warn("PeerJS 初始化受限，啟動備援:", err);
                fallbackToMqtt();
            }
        }

        function joinRoom() {
            cleanupNetwork(); // 加入房間前徹底清理舊狀態
            isLocalMode = false;
            const inputEl = document.getElementById('join-room-id');
            const roomId = (inputEl ? inputEl.value : "").trim().toUpperCase();
            if (inputEl) inputEl.value = roomId;

            if (!roomId || roomId.length !== 6) {
                showNotification('請輸入有效的 6 碼房間 ID！', 'warning');
                return;
            }

            const statusEl = document.getElementById('home-status');
            if (statusEl) statusEl.innerText = '正在尋找並連線至房間 ' + roomId + '...';
            myRole = 'B';
            let connectionEstablished = false;

            const handleJoinFailure = (msg) => {
                if (connectionEstablished) return;
                cleanupNetwork();
                if (statusEl) statusEl.innerText = '❌ ' + (msg || '連線失敗');
                showNotification('❌ ' + (msg || '找不到房間，請確認 6 碼 ID！'), 'error');
            };

            // 超時處理：若 6 秒內未成功與房主建立連線，停留在首頁並跳出提示
            joinTimeoutTimer = setTimeout(() => {
                if (!connectionEstablished) {
                    console.warn("[連線逾時] 找不到房間或房主未回應");
                    handleJoinFailure('找不到房間或連線超時！');
                }
            }, 6000);

            const handleJoinSuccess = () => {
                if (connectionEstablished) return;
                connectionEstablished = true;
                if (joinTimeoutTimer) {
                    clearTimeout(joinTimeoutTimer);
                    joinTimeoutTimer = null;
                }
                setupConnection();
                updateLobbyRoleUI();
                const roomIdDisplay = document.getElementById('display-room-id');
                if (roomIdDisplay) roomIdDisplay.innerText = roomId;
                
                // 只有在與房主連線成功開啟後，才切換畫面至連線大廳！
                showScreen('lobby-screen');
                
                const oppReadyStatus = document.getElementById('opp-ready-status');
                if (oppReadyStatus) {
                    oppReadyStatus.innerText = '已連線，未準備';
                    oppReadyStatus.className = 'text-red-500 font-bold text-xs';
                }
                const btnReady = document.getElementById('btn-ready');
                if (btnReady) btnReady.disabled = false;

                if (statusEl) statusEl.innerText = '';

                if (customMyName && conn && conn.open) {
                    conn.send({ type: 'UPDATE_NAME', name: customMyName });
                }
            };

            const fallbackToMqtt = () => {
                if (connectionEstablished) return;
                console.log("[網絡備援] 客戶端嘗試中繼連線");
                if (peer) { try { peer.destroy(); } catch(e){} peer = null; }

                try {
                    conn = new MqttRelayP2P(roomId, false);
                } catch(e) {
                    conn = new LocalBroadcastP2P(roomId, false);
                }

                setTimeout(() => {
                    if (conn && !conn.open && !(conn instanceof LocalBroadcastP2P)) {
                        try { conn.close(); } catch(e){}
                        conn = new LocalBroadcastP2P(roomId, false);
                        setupConnection();
                    }
                }, 1000);

                // 發送握手訊號驗證房主是否存在
                let pingCount = 0;
                let pingInterval = setInterval(() => {
                    pingCount++;
                    if (conn && conn.open) {
                        conn.send({ type: 'PING_HOST' });
                    }
                    if (pingCount > 5) {
                        clearInterval(pingInterval);
                    }
                }, 800);

                conn.on('data', (data) => {
                    if (data.type === 'PONG_HOST' || data.type === 'READY' || data.type === 'UPDATE_NAME') {
                        clearInterval(pingInterval);
                        handleJoinSuccess();
                    }
                });

                setTimeout(() => {
                    clearInterval(pingInterval);
                    if (!connectionEstablished) {
                        handleJoinFailure('找不到此房間 ID！');
                    }
                }, 5000);
            };

            if (typeof Peer === 'undefined') {
                fallbackToMqtt();
                return;
            }

            try {
                peer = new Peer(PEER_OPTIONS);

                peer.on('open', (id) => {
                    conn = peer.connect(roomId, { reliable: true });

                    const connectTimeout = setTimeout(() => {
                        if (!connectionEstablished) {
                            console.warn("WebRTC P2P 穿透逾時，切換 MQTT 嘗試");
                            fallbackToMqtt();
                        }
                    }, 3000);

                    conn.on('open', () => {
                        clearTimeout(connectTimeout);
                        handleJoinSuccess();
                    });

                    conn.on('error', (err) => {
                        clearTimeout(connectTimeout);
                        fallbackToMqtt();
                    });
                });

                peer.on('error', (err) => {
                    console.warn("PeerJS 錯誤:", err);
                    if (err && err.type === 'peer-unavailable') {
                        // 確定房主 Peer ID 不存在，直接宣佈失敗
                        handleJoinFailure('找不到此房間 ID！');
                    } else {
                        fallbackToMqtt();
                    }
                });

            } catch (err) {
                fallbackToMqtt();
            }
        }

        // --- 硬幣擲骰動畫與開局 ---
        function runCoinToss(preDeterminedFirst) {
            showScreen('cointoss-screen');
            const coinEl = document.getElementById('coin-element');
            const coinText = document.getElementById('coin-text');
            const resultText = document.getElementById('coin-result-text');

            const nameA = getPlayerDisplayName('A');
            const nameB = getPlayerDisplayName('B');

            if (resultText) resultText.innerText = '';
            let ticks = 0;
            const maxTicks = 20;

            const interval = setInterval(() => {
                ticks++;
                const isATurn = (ticks % 2 === 0);
                
                if (coinEl) coinEl.style.transform = `scale(${1 + (ticks % 3) * 0.06}) rotateY(${ticks * 45}deg)`;
                
                if (coinEl && coinText) {
                    if (isATurn) {
                        coinEl.style.borderColor = COLORS.cyan;
                        coinEl.style.color = COLORS.cyan;
                        coinEl.style.boxShadow = `0 0 30px ${COLORS.cyan}`;
                        coinText.innerText = nameA;
                    } else {
                        coinEl.style.borderColor = COLORS.crimson;
                        coinEl.style.color = COLORS.crimson;
                        coinEl.style.boxShadow = `0 0 30px ${COLORS.crimson}`;
                        coinText.innerText = nameB;
                    }
                }

                if (ticks >= maxTicks) {
                    clearInterval(interval);
                    if (coinEl) coinEl.style.transform = 'scale(1) rotateY(0deg)';
                    
                    firstPlayer = preDeterminedFirst;
                    const firstName = (firstPlayer === 'A') ? nameA : nameB;

                    if (coinEl && coinText && resultText) {
                        if (firstPlayer === 'A') {
                            coinEl.style.borderColor = COLORS.cyan;
                            coinEl.style.color = COLORS.cyan;
                            coinText.innerText = nameA;
                            resultText.innerText = `⚡ ${firstName} 獲得先攻權 (先手 1)`;
                            resultText.className = 'text-base sm:text-lg font-bold h-8 tracking-wider text-cyan-400 font-["Chakra_Petch"] tech-glow-cyan';
                        } else {
                            coinEl.style.borderColor = COLORS.crimson;
                            coinEl.style.color = COLORS.crimson;
                            coinText.innerText = nameB;
                            resultText.innerText = `⚡ ${firstName} 獲得先攻權 (先手 1)`;
                            resultText.className = 'text-base sm:text-lg font-bold h-8 tracking-wider text-pink-500 font-["Chakra_Petch"] tech-glow-crimson';
                        }
                    }

                    setTimeout(() => {
                        startNewMatch();
                    }, 1300);
                }
            }, 90);
        }

        function startNewMatch() {
            moveHistory = [];
            boardState = {};
            winningPath = null;
            lastNotifiedTurnPlayer = null;
            const winModal = document.getElementById('win-modal');
            if (winModal) {
                winModal.style.display = 'none';
                winModal.classList.add('hidden');
            }
            
            const topReturnBtn = document.getElementById('top-return-btn');
            if (topReturnBtn) {
                topReturnBtn.style.display = isLocalMode ? 'block' : 'none';
            }

            showScreen('game-screen');
            updateUI();
            resizeCanvas();
        }

        function getCurrentStep() {
            return moveHistory.length + 1;
        }

        function getCurrentPlayer() {
            const step = getCurrentStep();
            const patternVal = TURN_PATTERN[(step - 1) % 4];
            const secondPlayer = (firstPlayer === 'A') ? 'B' : 'A';
            return (patternVal === 1) ? firstPlayer : secondPlayer;
        }

        function getRemainingInTurn() {
            const m = moveHistory.length;
            if (m === 0) return 1;
            return (m % 2 === 1) ? 2 : 1;
        }

        function updateUI() {
            const player = getCurrentPlayer();
            const remaining = getRemainingInTurn();
            
            const dot = document.getElementById('ui-turn-dot');
            const text = document.getElementById('ui-turn-text');

            const displayName = getPlayerDisplayName(player);
            let turnTag = "";
            if (!isLocalMode) {
                turnTag = (player === myRole) ? " (你的回合)" : " (對手回合)";
            }

            if (dot && text) {
                if (player === 'A') {
                    dot.className = "w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full bg-cyan-400 inline-block shadow-[0_0_12px_#00f3ff] flex-shrink-0";
                    text.innerHTML = `輪到 <span class="text-cyan-400 font-bold">${displayName}</span>${turnTag} 下子 (剩餘 <span class="font-bold">${remaining}</span> 顆)`;
                } else {
                    dot.className = "w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full bg-pink-500 inline-block shadow-[0_0_12px_#ff0055] flex-shrink-0";
                    text.innerHTML = `輪到 <span class="text-pink-500 font-bold">${displayName}</span>${turnTag} 下子 (剩餘 <span class="font-bold">${remaining}</span> 顆)`;
                }
            }

            if (!winningPath && lastNotifiedTurnPlayer !== player) {
                lastNotifiedTurnPlayer = player;
                if (!isLocalMode) {
                    if (player === myRole) {
                        triggerTurnToast(player);
                    }
                } else {
                    triggerTurnToast(player);
                }
            }
        }

        // --- Canvas Geometry & Rendering ---
        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            if (!wrapper || !wrapper.clientWidth) return;
            
            const w = wrapper.clientWidth;
            const dpr = window.devicePixelRatio || 1;

            const totalWidthUnits = (GRID_SIZE + (GRID_SIZE - 1) * 0.5 + 2.0) * Math.sqrt(3);
            const totalHeightUnits = (GRID_SIZE * 1.5 + 4.2);

            hexRadius = (w * dpr) / totalWidthUnits;
            hexWidth = Math.sqrt(3) * hexRadius;
            hexHeight = 2 * hexRadius;

            const computedHeightInternal = hexRadius * totalHeightUnits;
            const computedHeightCSS = computedHeightInternal / dpr;

            canvas.width = w * dpr;
            canvas.height = computedHeightInternal;

            canvas.style.width = `${w}px`;
            canvas.style.height = `${computedHeightCSS}px`;

            boardOffsetX = (canvas.width - ((GRID_SIZE - 1) * 1.5 * hexWidth)) / 2;
            boardOffsetY = (canvas.height - ((GRID_SIZE - 1) * 1.5 * hexRadius)) / 2;

            drawBoard();
        }

        function getHexCenter(r, c) {
            const x = boardOffsetX + c * hexWidth + r * (hexWidth / 2);
            const y = boardOffsetY + r * (1.5 * hexRadius);
            return { x, y };
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    drawHexCell(r, c);
                }
            }

            drawCoordinateBadges();

            if (winningPath && winningPath.length > 0) {
                drawWinningPath();
            }
        }

        function drawCoordinateBadges() {
            ctx.save();
            const badgeRadius = hexRadius * 0.46;
            const fontSize = Math.max(10, hexRadius * 0.52);
            ctx.font = `700 ${fontSize}px "Share Tech Mono", monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const colLabels = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K'];

            for (let c = 0; c < GRID_SIZE; c++) {
                const topPos = getHexCenter(0, c);
                const topY = topPos.y - hexRadius * 1.45;
                drawBadgeCircle(topPos.x, topY, badgeRadius, colLabels[c], COLORS.crimson);

                const botPos = getHexCenter(GRID_SIZE - 1, c);
                const botY = botPos.y + hexRadius * 1.45;
                drawBadgeCircle(botPos.x, botY, badgeRadius, colLabels[c], COLORS.crimson);
            }

            for (let r = 0; r < GRID_SIZE; r++) {
                const leftPos = getHexCenter(r, 0);
                const leftX = leftPos.x - hexWidth * 0.85;
                drawBadgeCircle(leftX, leftPos.y, badgeRadius, (r + 1).toString(), COLORS.cyan);

                const rightPos = getHexCenter(r, GRID_SIZE - 1);
                const rightX = rightPos.x + hexWidth * 0.85;
                drawBadgeCircle(rightX, rightPos.y, badgeRadius, (r + 1).toString(), COLORS.cyan);
            }

            ctx.restore();
        }

        function drawBadgeCircle(x, y, radius, text, color) {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = COLORS.cellBg;
            ctx.fill();

            ctx.lineWidth = Math.max(1, radius * 0.16);
            ctx.strokeStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 6;
            ctx.stroke();

            ctx.shadowBlur = 4;
            ctx.fillStyle = color;
            ctx.fillText(text, x, y + 1);
            ctx.shadowBlur = 0;
        }

        function drawHexCell(r, c) {
            const { x, y } = getHexCenter(r, c);
            const key = `${r},${c}`;
            const cellData = boardState[key];
            const isHovered = hoveredCell && hoveredCell.r === r && hoveredCell.c === c && !cellData && (isLocalMode || getCurrentPlayer() === myRole);

            ctx.save();
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 180) * (60 * i - 30);
                const px = x + hexRadius * Math.cos(angle);
                const py = y + hexRadius * Math.sin(angle);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();

            if (cellData) {
                const isPlayerA = (cellData.color === 'A');
                const fillColor = isPlayerA ? COLORS.cyan : COLORS.crimson;

                ctx.fillStyle = fillColor;
                ctx.fill();

                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 5;
                ctx.fillStyle = '#ffffff';
                ctx.font = `900 ${hexRadius * 0.68}px Orbitron, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(cellData.step, x, y + 1);

            } else if (isHovered) {
                const curPlayer = getCurrentPlayer();
                ctx.fillStyle = (curPlayer === 'A') ? 'rgba(0, 243, 255, 0.25)' : 'rgba(255, 0, 85, 0.25)';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = (curPlayer === 'A') ? COLORS.cyan : COLORS.crimson;
                ctx.stroke();
            } else {
                ctx.fillStyle = COLORS.cellBg;
                ctx.fill();
                ctx.lineWidth = Math.max(1, hexRadius * 0.05);
                ctx.strokeStyle = COLORS.gridLine;
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawWinningPath() {
            if (!winningPath || winningPath.length < 2) return;

            ctx.save();
            ctx.beginPath();
            winningPath.forEach((pt, index) => {
                const { x, y } = getHexCenter(pt.r, pt.c);
                if (index === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });

            ctx.lineWidth = Math.max(3, hexRadius * 0.2);
            ctx.strokeStyle = '#ffffff';
            ctx.shadowColor = '#ffff00';
            ctx.shadowBlur = 18;
            ctx.stroke();

            winningPath.forEach(pt => {
                const { x, y } = getHexCenter(pt.r, pt.c);
                ctx.beginPath();
                ctx.arc(x, y, Math.max(3, hexRadius * 0.2), 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            });

            ctx.restore();
        }

        function setupCanvasEvents() {
            let touchStartX = 0;
            let touchStartY = 0;
            let isTouchMove = false;

            function getEventPos(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else if (e.changedTouches && e.changedTouches.length > 0) {
                    clientX = e.changedTouches[0].clientX;
                    clientY = e.changedTouches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }

            function handleMove(e) {
                const pos = getEventPos(e);
                const found = findNearestHex(pos.x, pos.y);
                if (found !== hoveredCell) {
                    hoveredCell = found;
                    drawBoard();
                }
            }

            function handleClick(e) {
                if (!isLocalMode && getCurrentPlayer() !== myRole) return; 

                const pos = getEventPos(e);
                const hex = findNearestHex(pos.x, pos.y);
                if (hex) {
                    makeMove(hex.r, hex.c, false);
                }
            }

            canvas.addEventListener('mousemove', handleMove);
            canvas.addEventListener('click', handleClick);

            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    isTouchMove = false;
                }
            }, { passive: true });

            canvas.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) {
                    const dx = Math.abs(e.touches[0].clientX - touchStartX);
                    const dy = Math.abs(e.touches[0].clientY - touchStartY);
                    if (dx > 10 || dy > 10) {
                        isTouchMove = true;
                    }
                }
            }, { passive: true });

            canvas.addEventListener('touchend', (e) => {
                if (!isTouchMove) {
                    handleClick(e);
                }
            });
        }

        function setupConnection() {
            conn.on('data', (data) => {
                if (joinTimeoutTimer) clearTimeout(joinTimeoutTimer);
                if (createTimeoutTimer) clearTimeout(createTimeoutTimer);

                // 收到對手任何數據即標記對手已連線，並取消 10 分鐘空房計時
                if (!isOpponentConnected && myRole === 'A') {
                    isOpponentConnected = true;
                    if (emptyRoomTimer) {
                        clearTimeout(emptyRoomTimer);
                        emptyRoomTimer = null;
                    }
                }

                if (data.type === 'PING_HOST' && myRole === 'A') {
                    if (conn && conn.open) {
                        conn.send({ type: 'PONG_HOST' });
                        if (customMyName) {
                            conn.send({ type: 'UPDATE_NAME', name: customMyName });
                        }
                    }
                    return;
                }
                if (data.type === 'READY') {
                    oppReady = data.status;
                    const statusEl = document.getElementById('opp-ready-status');
                    if (statusEl) {
                        statusEl.innerText = oppReady ? '已準備' : '未準備';
                        statusEl.className = oppReady ? 'text-green-400 font-bold text-xs' : 'text-red-500 font-bold text-xs';
                    }
                    checkBothReady();
                } 
                else if (data.type === 'UPDATE_NAME') {
                    customOppName = (data.name || "").slice(0, 10);
                    updateLobbyRoleUI();
                }
                else if (data.type === 'START_TOSS') {
                    runCoinToss(data.first);
                } 
                else if (data.type === 'MOVE') {
                    makeMove(data.r, data.c, true);
                }
                else if (data.type === 'PLAY_AGAIN') {
                    resetLobby();
                }
            });

            conn.on('close', () => {
                // 只有在對手確實曾連入過的情況下，才跳出對手離線通知並退回首頁
                if (isOpponentConnected) {
                    showNotification('對手已離開房間！', 'warning');
                    goHome();
                }
            });
        }

        function findNearestHex(mx, my) {
            let minDistance = Infinity;
            let nearest = null;

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const { x, y } = getHexCenter(r, c);
                    const dist = Math.hypot(mx - x, my - y);
                    if (dist < hexRadius * 0.95 && dist < minDistance) {
                        minDistance = dist;
                        nearest = { r, c };
                    }
                }
            }
            return nearest;
        }

        // --- 遊戲邏輯與 BFS 勝利判斷 ---
        function makeMove(r, c, isRemote = false) {
            if (winningPath) return; 
            const key = `${r},${c}`;
            if (boardState[key]) return; 

            const step = getCurrentStep();
            const player = getCurrentPlayer();

            if (!isLocalMode && !isRemote && conn && conn.open) {
                conn.send({ type: 'MOVE', r: r, c: c });
            }

            boardState[key] = { color: player, step };
            moveHistory.push({ r, c, color: player, step });

            updateUI();
            drawBoard();

            const winPath = checkWin(player);
            if (winPath) {
                winningPath = winPath;
                drawBoard();

                setTimeout(() => {
                    triggerGameOver(player, winPath);
                }, 400);
            }
        }

        function getNeighbors(r, c) {
            const neighbors = [
                { r: r,     c: c - 1 }, 
                { r: r,     c: c + 1 }, 
                { r: r - 1, c: c     }, 
                { r: r - 1, c: c + 1 }, 
                { r: r + 1, c: c - 1 }, 
                { r: r + 1, c: c     }  
            ];
            return neighbors.filter(n => n.r >= 0 && n.r < GRID_SIZE && n.c >= 0 && n.c < GRID_SIZE);
        }

        function checkWin(player) {
            const queue = [];
            const visited = new Set();
            const parentMap = {};

            if (player === 'B') {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const key = `0,${c}`;
                    if (boardState[key] && boardState[key].color === 'B') {
                        queue.push({ r: 0, c });
                        visited.add(key);
                    }
                }
            } else { 
                for (let r = 0; r < GRID_SIZE; r++) {
                    const key = `${r},0`;
                    if (boardState[key] && boardState[key].color === 'A') {
                        queue.push({ r, c: 0 });
                        visited.add(key);
                    }
                }
            }

            while (queue.length > 0) {
                const curr = queue.shift();
                const currKey = `${curr.r},${curr.c}`;

                if ((player === 'B' && curr.r === GRID_SIZE - 1) ||
                    (player === 'A' && curr.c === GRID_SIZE - 1)) {
                    
                    const path = [curr];
                    let pKey = currKey;
                    while (parentMap[pKey]) {
                        const parent = parentMap[pKey];
                        path.unshift(parent);
                        pKey = `${parent.r},${parent.c}`;
                    }
                    return path;
                }

                const neighbors = getNeighbors(curr.r, curr.c);
                for (let n of neighbors) {
                    const nKey = `${n.r},${n.c}`;
                    if (!visited.has(nKey) && boardState[nKey] && boardState[nKey].color === player) {
                        visited.add(nKey);
                        parentMap[nKey] = curr;
                        queue.push(n);
                    }
                }
            }

            return null;
        }

        // --- 結算與功能選項 ---
        function triggerGameOver(winner, path) {
            const modal = document.getElementById('win-modal');
            const titleEl = document.getElementById('modal-winner-title');
            const descEl = document.getElementById('modal-winner-desc');

            const winnerName = getPlayerDisplayName(winner);

            if (titleEl) {
                if (winner === 'A') {
                    titleEl.innerText = `${winnerName} 獲勝！`;
                    titleEl.className = 'text-2xl md:text-3xl font-black mb-2 text-cyan-400 font-["Chakra_Petch"] tech-glow-cyan truncate max-w-full';
                } else {
                    titleEl.innerText = `${winnerName} 獲勝！`;
                    titleEl.className = 'text-2xl md:text-3xl font-black mb-2 text-pink-500 font-["Chakra_Petch"] tech-glow-crimson truncate max-w-full';
                }
            }

            if (descEl) {
                descEl.innerText = (winner === 'A') ? 'SYSTEM CONNECTED: LEFT ➔ RIGHT' : 'SYSTEM CONNECTED: TOP ➔ BOTTOM';
            }

            if (modal) {
                modal.style.display = 'flex';
                modal.classList.remove('hidden');
            }
        }

        function downloadRecord() {
            drawBoard();
            const imageURL = canvas.toDataURL('image/png');
            const downloadLink = document.createElement('a');
            downloadLink.download = `HEX_CORE_MATCH_${Date.now()}.png`;
            downloadLink.href = imageURL;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        function playAgain() {
            if (isLocalMode) {
                startLocalGame();
            } else {
                if (conn && conn.open) {
                    conn.send({ type: 'PLAY_AGAIN' });
                }
                resetLobby();
            }
        }

        function returnToLobbyOrHome() {
            if (isLocalMode) {
                goHome();
            } else {
                resetLobby();
            }
        }

        function goHome() {
            cleanupNetwork();
            const winModal = document.getElementById('win-modal');
            if (winModal) {
                winModal.style.display = 'none';
                winModal.classList.add('hidden');
            }
            showScreen('home-screen');
        }
    </script>
